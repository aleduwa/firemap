<style>
  :root {
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --surface:    #fcfcfb;
    --hairline:   rgba(11,11,11,0.10);
    --age-0:      #8f1d1d;   /* < 24 h  */
    --age-1:      #d03b3b;   /* 24–48 h */
    --age-2:      #f0956e;   /* älter   */
    --persistent: #898781;   /* dauerhafte Wärmequelle (Industrie) */
  }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface); }
  /* Der Canvas ist außerhalb der Kugel transparent — der Container liefert
     deshalb den "Weltraum" hinter dem Globus. Beim Reinzoomen deckt der
     background-Layer des Stils alles ab, die Farbe ist dann unsichtbar. */
  #map { height: 100%; background: #0d1524; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(11,11,11,0.12);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 280px;
  }
  .panel h1 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
  .panel .meta { color: var(--ink-2); font-size: 12px; }
  .panel .meta b { color: var(--ink); font-weight: 600; }

  /* Prototyp-Hinweis oben im Info-Panel */
  .proto-note {
    display: block; margin: -2px 0 6px; padding: 3px 6px; border-radius: 5px;
    background: #fff5d6; border: 1px solid #e0c56b; color: #6b5310;
    font-size: 11.5px; font-weight: 600;
  }
  .proto-note a { color: #8f1d1d; }

  .range-ctl { display: flex; gap: 4px; padding: 6px; }
  .range-ctl .lbl { font-size: 11.5px; color: var(--ink-2); align-self: center; padding: 0 4px 0 2px; }
  .range-btn {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .range-btn:hover { background: #f1f0ec; }
  .range-btn.active { background: #8f1d1d; border-color: #8f1d1d; color: #fff; font-weight: 600; }

  .legend .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .legend .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--hairline); flex: none; }
  .legend .dot.dashed { border: 2px dashed #fff; }
  .legend .label { color: var(--ink-2); font-size: 12px; }
  .legend .size-hint { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--muted); font-size: 11.5px; }

  /* Tooltip (Desktop-Hover) und Popup-Inhalt teilen sich die Optik der Leaflet-Karte */
  .fire-tip {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(11,11,11,0.18);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
  }
  .fire-tip .tip-head { font-weight: 650; margin-bottom: 2px; }
  .fire-tip .tip-sub { color: var(--ink-2); }
  .fire-tip .tip-flag { color: var(--muted); font-style: italic; margin-top: 3px; }
  .fire-tip table { border-collapse: collapse; margin-top: 4px; }
  .fire-tip td { padding: 0 0 1px; color: var(--ink); }
  .fire-tip td:first-child { color: var(--ink-2); padding-right: 10px; }

  /* Der Hover-Tooltip ist ein freies DIV über der Karte (MapLibre hat kein
     Tooltip-Konzept wie Leaflet) */
  #hovertip {
    position: absolute; z-index: 5; pointer-events: none; display: none;
    max-width: 300px; transform: translate(-50%, -100%); margin-top: -12px;
  }

  /* Popups: Rahmen von MapLibre entfernen, unser .fire-tip bringt ihn mit */
  .maplibregl-popup.fire-popup .maplibregl-popup-content {
    padding: 0; background: transparent; box-shadow: none; border-radius: 8px;
  }
  .maplibregl-popup.fire-popup .maplibregl-popup-tip { border-top-color: var(--surface); border-bottom-color: var(--surface); }
  .maplibregl-popup.fire-popup .maplibregl-popup-close-button {
    font-size: 17px; color: var(--ink-2); padding: 0 5px; z-index: 2;
  }
  /* Attribution muss auch über dunklem Weltraum und über Satellitenbildern
     lesbar bleiben -> eigener heller Hintergrund statt MapLibre-Default */
  .maplibregl-ctrl-attrib { font-size: 10px; background: rgba(252,252,251,.9) !important; border-radius: 4px 0 0 0; }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color: var(--ink-2); }

  /* Marker-Icons (Meldungen, DWD-Stationen) sind DOM-Marker wie in index.html */
  .mk { cursor: pointer; }

  .mode-switch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 4;
    display: flex; background: #fcfcfb; border: 1px solid rgba(11,11,11,.1); border-radius: 8px;
    box-shadow: 0 1px 4px rgba(11,11,11,.12); overflow: hidden; }
  .mode-switch a { padding: 6px 14px; font-size: 13px; text-decoration: none; color: #52514e; }
  .mode-switch a.active { background: #8f1d1d; color: #fff; font-weight: 600; }
  .mode-switch a:not(.active):hover { background: #f1f0ec; }

  /* Layer-Menü unten links: MapLibre bringt kein Layer-Control mit,
     deshalb nachgebaut in der Optik von index.html (eingeklapptes Icon) */
  .layer-ctl { padding: 0; max-width: 300px; }
  .layer-ctl .lc-toggle {
    width: 34px; height: 34px; border: 0; background: transparent; padding: 0;
    font-size: 17px; line-height: 1; cursor: pointer; display: block; font-family: inherit;
  }
  .layer-ctl .lc-body { display: none; padding: 8px 10px 10px; }
  .layer-ctl.open .lc-body { display: block; }
  .layer-ctl.open .lc-toggle { display: none; }
  .layer-ctl .lc-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 650; color: var(--ink); margin-bottom: 4px;
  }
  .layer-ctl .lc-close { border: 0; background: transparent; cursor: pointer; font-size: 15px; color: var(--muted); font-family: inherit; }
  .layer-ctl .lc-group { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--hairline); }
  .layer-ctl .lc-group:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .layer-ctl label {
    display: flex; gap: 7px; align-items: flex-start; font-size: 12px;
    color: var(--ink-2); padding: 3px 0; cursor: pointer; line-height: 1.35;
  }
  .layer-ctl input { margin: 2px 0 0; flex: none; accent-color: #8f1d1d; }
  .layer-ctl .lc-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }

  /* Einklapp-Buttons der Karten-Panels: nur auf Mobile sichtbar */
  .mob-toggle { display: none; }

  @media (max-width: 640px) {
    body { height: 100dvh; }
    .mode-switch a { padding: 9px 12px; }
    .maplibregl-ctrl-group { display: none; }         /* Zoom-Buttons wie in index.html ausblenden */
    .maplibregl-ctrl-top-left { top: 44px; }
    .maplibregl-ctrl-top-right { top: 44px; }
    .panel { max-width: min(230px, calc(100vw - 60px)); padding: 8px 10px; }
    .range-btn { padding: 8px 10px; font-size: 13px; min-height: 36px; }
    .range-ctl { flex-wrap: wrap; }
    .legend { max-width: 200px; max-height: 38vh; overflow-y: auto; overscroll-behavior: contain; }
    .legend .size-hint { display: none; }
    .layer-ctl .lc-body { max-height: 52vh; overflow-y: auto; overscroll-behavior: contain; }

    .mob-toggle { display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: 0; background: transparent; padding: 0;
      font-size: 18px; line-height: 1; cursor: pointer; flex: none; font-family: inherit; }
    .mob-collapsible.collapsed { width: 42px; height: 42px; padding: 3px; overflow: hidden;
      max-width: 42px; max-height: 42px; }
    .mob-collapsible.collapsed > *:not(.mob-toggle) { display: none !important; }
  }
</style>

<script>
(function () {
  'use strict';

  // ==========================================================================
  // Vektor-Tile-Quelle — die EINE Stelle, die beim Umzug auf eigenes Hosting
  // geändert wird (Details: GLOBE.md).
  //
  //   mode: 'openfreemap'  Fremdquelle, kostenlos, ohne Key, ohne Registrierung.
  //                        url = TileJSON-Endpunkt (MapLibre holt sich daraus
  //                        die aktuelle Tile-URL, die bei OFM datiert ist).
  //
  //   mode: 'pmtiles'      Eigene PMTiles-Datei (z. B. BW-Ausschnitt aus dem
  //                        Protomaps-Planet) auf Cloudflare R2. Dann:
  //                          mode:   'pmtiles'
  //                          url:    'https://tiles.aleduwa.de/bw.pmtiles'
  //                          glyphs: '/fonts/{fontstack}/{range}.pbf'   (selbst hosten!)
  //                        Achtung: Der Protomaps-Planet nutzt das
  //                        Protomaps-Schema, nicht OpenMapTiles — die
  //                        source-layer-Namen unten müssen dann angepasst
  //                        werden (siehe GLOBE.md, Abschnitt "Schema").
  //                        Alternativ eigene OpenMapTiles-PMTiles bauen, dann
  //                        bleibt der Stil unverändert.
  // ==========================================================================
  const TILES = {
    mode: 'openfreemap',
    url: 'https://tiles.openfreemap.org/planet',
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    attribution: '&copy; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> ' +
                 '&middot; &copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> ' +
                 '&middot; Daten &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  };

  // PMTiles-Protokoll registrieren (no-op, solange mode !== 'pmtiles')
  if (window.pmtiles && maplibregl.addProtocol) {
    maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
  }

  const LS = 'firemap.';    // Präfix der Karteneinstellungen (Zeitraum, Ebenen, Stil)

  // Ohne WebGL kann MapLibre nicht rendern (alte Rechner, abgeschaltete
  // Hardwarebeschleunigung, manche VMs). Dann zur klassischen Rasterkarte
  // schicken, statt eine leere Fläche zu zeigen.
  try {
    const probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('kein WebGL');
  } catch (e) {
    location.replace('klassisch.html?nowebgl=1');
    return;
  }
  // Touch: Tap löst Hover UND Klick aus -> Tooltip weglassen, Details ins Popup
  const IS_TOUCH = window.matchMedia && window.matchMedia('(hover: none)').matches;
  const isMobile = () => window.matchMedia && window.matchMedia('(max-width: 640px)').matches;

  // ---- Kartenstile ---------------------------------------------------------
  // "Ruhig" und "Dunkel" sind eigene Style-JSONs: Sie definieren nur Flächen,
  // Wasser, Wald, Straßen, Grenzen und Ortsnamen. POI-Layer (Gipfel, Kliniken,
  // Restaurants …) existieren gar nicht erst — es gibt bewusst auch kein
  // Sprite, also können überhaupt keine Icons gerendert werden.
  const PAL = {
    hell: {
      bg: '#f4f4f1', water: '#ccd6dd', waterline: '#c2ccd4',
      wood: '#e0e7dc', grass: '#e8ece3', residential: '#eeedea',
      building: '#e5e4e0', roadFill: '#ffffff', roadCase: '#e2e1dc',
      motorway: '#fbf6ec', motorwayCase: '#e6ddc8', rail: '#e0dfda',
      boundary: '#bab8b2', text: '#52514e', textMinor: '#898781',
      // sky/horizon = Weltraum bzw. Atmosphärensaum beim Rauszoomen.
      // Bewusst deutlich dunkler als die Karte, sonst verschwimmt die Kugel
      // beim Rauszoomen mit dem weißen Seitenhintergrund.
      halo: '#fcfcfb', sky: '#20344d', horizon: '#b7d0e6', space: '#101c2b',
      skyBlend: 0.25
    },
    dunkel: {
      bg: '#15171b', water: '#0f1c26', waterline: '#16303f',
      wood: '#1a2620', grass: '#1c231d', residential: '#1c1e22',
      building: '#23262b', roadFill: '#2e3238', roadCase: '#1c1f24',
      motorway: '#3c3f44', motorwayCase: '#22252a', rail: '#25282d',
      boundary: '#3d4147', text: '#b7b5af', textMinor: '#7d7b76',
      halo: '#0d0e10', sky: '#05070c', horizon: '#25405e', space: '#04050a',
      skyBlend: 0.2
    }
  };

  function vectorSource() {
    const src = { type: 'vector', attribution: TILES.attribution };
    if (TILES.mode === 'pmtiles') { src.url = 'pmtiles://' + TILES.url; }
    else { src.url = TILES.url; }
    return src;
  }

  // Beschriftungen: nur Ortsnamen, Gewässer, Straßennamen — keine POIs.
  function labelLayers(p, onImagery) {
    const halo = onImagery ? 'rgba(11,11,11,.85)' : p.halo;
    const txt = onImagery ? '#ffffff' : p.text;
    const txtMinor = onImagery ? '#e8e8e8' : p.textMinor;
    const name = ['coalesce', ['get', 'name:de'], ['get', 'name']];
    return [
      { id: 'label-water', type: 'symbol', source: 'omt', 'source-layer': 'water_name', minzoom: 9,
        layout: { 'text-field': name, 'text-font': ['Noto Sans Italic'], 'text-size': 11, 'text-max-width': 6 },
        paint: { 'text-color': onImagery ? '#cfe4f5' : '#7a8b96', 'text-halo-color': halo, 'text-halo-width': 1.2 } },
      { id: 'label-street', type: 'symbol', source: 'omt', 'source-layer': 'transportation_name', minzoom: 14,
        layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': 10.5,
                  'symbol-placement': 'line', 'text-max-angle': 30 },
        paint: { 'text-color': txtMinor, 'text-halo-color': halo, 'text-halo-width': 1.4 } },
      { id: 'label-village', type: 'symbol', source: 'omt', 'source-layer': 'place', minzoom: 10,
        filter: ['match', ['get', 'class'], ['village', 'hamlet', 'suburb', 'neighbourhood'], true, false],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': 11, 'text-max-width': 8 },
        paint: { 'text-color': txtMinor, 'text-halo-color': halo, 'text-halo-width': 1.4 } },
      { id: 'label-town', type: 'symbol', source: 'omt', 'source-layer': 'place', minzoom: 7,
        filter: ['==', ['get', 'class'], 'town'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'],
                  'text-size': ['interpolate', ['linear'], ['zoom'], 7, 11, 12, 14], 'text-max-width': 8 },
        paint: { 'text-color': txt, 'text-halo-color': halo, 'text-halo-width': 1.5 } },
      { id: 'label-city', type: 'symbol', source: 'omt', 'source-layer': 'place', minzoom: 4,
        filter: ['==', ['get', 'class'], 'city'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Bold'],
                  'text-size': ['interpolate', ['linear'], ['zoom'], 4, 11, 10, 16], 'text-max-width': 8 },
        paint: { 'text-color': txt, 'text-halo-color': halo, 'text-halo-width': 1.6 } },
      { id: 'label-state', type: 'symbol', source: 'omt', 'source-layer': 'place', minzoom: 4, maxzoom: 8,
        filter: ['==', ['get', 'class'], 'state'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': 11,
                  'text-transform': 'uppercase', 'text-letter-spacing': 0.1 },
        paint: { 'text-color': txtMinor, 'text-halo-color': halo, 'text-halo-width': 1.4 } },
      { id: 'label-country', type: 'symbol', source: 'omt', 'source-layer': 'place', maxzoom: 9,
        filter: ['==', ['get', 'class'], 'country'],
        layout: { 'text-field': name, 'text-font': ['Noto Sans Bold'],
                  'text-size': ['interpolate', ['linear'], ['zoom'], 1, 10, 6, 15],
                  'text-transform': 'uppercase', 'text-letter-spacing': 0.08, 'text-max-width': 7 },
        paint: { 'text-color': txt, 'text-halo-color': halo, 'text-halo-width': 1.6 } }
    ];
  }

  function skyFor(p) {
    return {
      'sky-color': p.sky,
      'horizon-color': p.horizon,
      'fog-color': p.space,
      'sky-horizon-blend': p.skyBlend == null ? 0.25 : p.skyBlend,
      'horizon-fog-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
    };
  }

  // Eigener, ruhiger Basisstil (hell oder dunkel)
  function baseStyle(p) {
    return {
      version: 8,
      name: 'Ruhig (ohne POI)',
      glyphs: TILES.glyphs,
      projection: { type: 'globe' },
      sky: skyFor(p),
      sources: { omt: vectorSource() },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': p.bg } },
        { id: 'landcover-wood', type: 'fill', source: 'omt', 'source-layer': 'landcover',

          paint: { 'fill-color': p.wood, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 5, 0.5, 9, 1] } },
        { id: 'landcover-grass', type: 'fill', source: 'omt', 'source-layer': 'landcover',
          filter: ['match', ['get', 'class'], ['grass', 'farmland'], true, false],

        { id: 'park', type: 'fill', source: 'omt', 'source-layer': 'park', minzoom: 7,
          paint: { 'fill-color': p.grass, 'fill-opacity': 0.55 } },
        { id: 'landuse-residential', type: 'fill', source: 'omt', 'source-layer': 'landuse', minzoom: 9,
          filter: ['match', ['get', 'class'], ['residential', 'suburb', 'neighbourhood'], true, false],
          paint: { 'fill-color': p.residential } },
        { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water',
          filter: ['!=', ['get', 'brunnel'], 'tunnel'],
          paint: { 'fill-color': p.water } },
        { id: 'waterway', type: 'line', source: 'omt', 'source-layer': 'waterway', minzoom: 8,
          paint: { 'line-color': p.waterline, 'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.5, 14, 2] } },
        { id: 'building', type: 'fill', source: 'omt', 'source-layer': 'building', minzoom: 14,
          paint: { 'fill-color': p.building, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, 0.9] } },
        { id: 'rail', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 11,

        { id: 'road-minor', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 12,

        { id: 'road-secondary-case', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 9,
          filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.roadCase, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 1.4, 16, 8] } },
        { id: 'road-secondary', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 9,
          filter: ['match', ['get', 'class'], ['secondary', 'tertiary'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.roadFill, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 0.6, 16, 5.5] } },
        { id: 'road-primary-case', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 7,
          filter: ['match', ['get', 'class'], ['primary', 'trunk'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.roadCase, 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 1.6, 16, 10] } },
        { id: 'road-primary', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 7,
          filter: ['match', ['get', 'class'], ['primary', 'trunk'], true, false],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.roadFill, 'line-width': ['interpolate', ['linear'], ['zoom'], 7, 0.8, 16, 7] } },
        { id: 'road-motorway-case', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 5,
          filter: ['==', ['get', 'class'], 'motorway'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.motorwayCase, 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 1.4, 16, 12] } },
        { id: 'road-motorway', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 5,
          filter: ['==', ['get', 'class'], 'motorway'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': p.motorway, 'line-width': ['interpolate', ['linear'], ['zoom'], 5, 0.7, 16, 9] } },
        { id: 'boundary-state', type: 'line', source: 'omt', 'source-layer': 'boundary',
          filter: ['all', ['>=', ['get', 'admin_level'], 3], ['<=', ['get', 'admin_level'], 4]],
          paint: { 'line-color': p.boundary, 'line-width': 0.8, 'line-dasharray': [3, 2], 'line-opacity': 0.7 } },
        { id: 'boundary-country', type: 'line', source: 'omt', 'source-layer': 'boundary',
          filter: ['<=', ['get', 'admin_level'], 2],
          paint: { 'line-color': p.boundary, 'line-width': ['interpolate', ['linear'], ['zoom'], 3, 0.8, 10, 1.8] } }
      ].concat(labelLayers(p, false))
    };
  }

  // Satellitenbild (Esri World Imagery) + nur Beschriftungen aus der Vektorquelle
  function satelliteStyle() {
    const p = PAL.dunkel;
    return {
      version: 8,
      name: 'Satellit',
      glyphs: TILES.glyphs,
      projection: { type: 'globe' },
      sky: skyFor({ sky: '#0a1220', horizon: '#22354a', space: '#05070a' }),
      sources: {
        omt: vectorSource(),
        imagery: {
          type: 'raster', tileSize: 256, maxzoom: 19,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          attribution: 'Bilddaten &copy; Esri, Maxar, Earthstar Geographics'
        }
      },
      layers: [
        { id: 'bg', type: 'background', paint: { 'background-color': '#0b0f14' } },
        { id: 'imagery', type: 'raster', source: 'imagery' },
        { id: 'boundary-country', type: 'line', source: 'omt', 'source-layer': 'boundary',
          filter: ['<=', ['get', 'admin_level'], 2],
          paint: { 'line-color': 'rgba(255,255,255,.5)', 'line-width': 1 } }
      ].concat(labelLayers(p, true))
    };
  }

  const STYLES = {
    ruhig:    { label: 'Ruhig (ohne POI)',   build: () => baseStyle(PAL.hell) },
    dunkel:   { label: 'Dunkel (ohne POI)',  build: () => baseStyle(PAL.dunkel) },
    detail:   { label: 'Bunt / Detail (OFM Liberty, mit POI)', url: 'https://tiles.openfreemap.org/styles/liberty' },
    satellit: { label: 'Satellit (Esri)',    build: () => satelliteStyle() }
  };
  let styleChoice = localStorage.getItem(LS + 'style') || 'ruhig';
  if (!STYLES[styleChoice]) styleChoice = 'ruhig';

  // ---- Karte ---------------------------------------------------------------
  const map = new maplibregl.Map({
    container: 'map',
    style: STYLES[styleChoice].url || STYLES[styleChoice].build(),
    // Startansicht wie index.html: ganz Baden-Württemberg
    bounds: [[7.5, 47.53], [10.5, 49.8]],
    fitBoundsOptions: { padding: 20 },
    attributionControl: false,
    maxZoom: 18
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
  map.addControl(new maplibregl.AttributionControl({
    compact: false,
    customAttribution:
      '<a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a> &middot; ' +
      '<a href="faq.html">FAQ</a> &middot; ' +
      '<a href="impressum.html">Impressum</a> &middot; ' +
      '<a href="datenschutz.html">Datenschutz</a> &middot; ' +
      '<a href="hinweise.html">Hinweise &amp; Quellen</a> &middot; ' +
      '<a href="klassisch.html" title="Karte ohne WebGL (Rasterkacheln)">klassische Karte</a>'
  }), 'bottom-right');

  // ---- Daten & Hilfsfunktionen --------------------------------------------
  const AGE = [
    { max: 24,       color: '#8f1d1d', label: 'letzte 24 Stunden' },
    { max: 48,       color: '#d03b3b', label: '24–48 Stunden' },
    { max: Infinity, color: '#f0956e', label: 'älter' }
  ];
  const CONF_LABEL = { l: 'niedrig', n: 'nominal', h: 'hoch', low: 'niedrig', nominal: 'nominal', high: 'hoch' };

  const data = window.FIRE_DATA || { points: [], generated: '–' };
  const reportData = window.REPORT_DATA || { reports: [] };
  const wbiData = window.WBI_DATA || { stations: [] };
  const scarData = window.BURNSCAR_DATA || { scars: [] };
  const now = Date.now();

  // Dauerhafte Wärmequellen (Raffinerien, Stahlwerke …) erkennen:
  // gleiche ~1-km-Zelle an >= 5 verschiedenen Tagen detektiert.
  const cellDays = new Map();
  for (const p of data.points) {
    const cell = p.lat.toFixed(2) + '/' + p.lon.toFixed(2);
    if (!cellDays.has(cell)) cellDays.set(cell, new Set());
    cellDays.get(cell).add(p.date);
  }
  const isPersistent = p => cellDays.get(p.lat.toFixed(2) + '/' + p.lon.toFixed(2)).size >= 5;

  function acqDate(p) {
    return new Date(p.date + 'T' + p.time.slice(0, 2) + ':' + p.time.slice(2) + ':00Z');
  }
  function ageClass(p) {
    const h = (now - acqDate(p).getTime()) / 3.6e6;
    return AGE.findIndex(a => h <= a.max);
  }
  function fmtLocal(d) {
    return d.toLocaleString('de-DE', {
      timeZone: 'Europe/Berlin', weekday: 'short', day: '2-digit', month: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }) + ' Uhr';
  }

  function tooltipHtml(p, persistent) {
    const d = acqDate(p);
    const conf = CONF_LABEL[String(p.conf).toLowerCase()] || (p.conf + ' %');
    return '<div class="tip-head">Satelliten-Detektion</div>' +
      '<div class="tip-sub">' + fmtLocal(d) + ' (lokal)</div>' +
      '<table>' +
      '<tr><td>Satellit</td><td>' + p.source + '</td></tr>' +
      '<tr><td>Feuerleistung</td><td>' + p.frp.toFixed(1) + ' MW (FRP)</td></tr>' +
      '<tr><td>Helligkeit</td><td>' + Math.round(p.bright) + ' K</td></tr>' +
      '<tr><td>Konfidenz</td><td>' + conf + '</td></tr>' +
      '<tr><td>Tag/Nacht</td><td>' + (p.dn === 'D' ? 'Tag' : 'Nacht') + '</td></tr>' +
      '<tr><td>Position</td><td>' + p.lat.toFixed(4) + ', ' + p.lon.toFixed(4) + '</td></tr>' +
      '</table>' +
      (persistent ? '<div class="tip-flag">Wahrscheinlich dauerhafte W&auml;rmequelle (Industrie)</div>' : '');
  }

  // scan/track = Pixelgröße des Sensors in km. Der Footprint zeigt ehrlich,
  // wie grob eine Detektion ist; die Vereinigung überlappender Footprints
  // benachbarter Detektionen ergibt eine grobe Schätzung der betroffenen Fläche.
  function footprintPolygon(p) {
    const rLat = (p.track || 0.375) / 2 / 111;
    const rLon = (p.scan || 0.375) / 2 / (111 * Math.cos(p.lat * Math.PI / 180));
    const ring = [];
    for (let a = 0; a < 360; a += 30) {
      const rad = a * Math.PI / 180;
      ring.push([p.lon + rLon * Math.cos(rad), p.lat + rLat * Math.sin(rad)]);
    }
    ring.push(ring[0]);
    return turf.polygon([ring]);
  }

  const STATUS_LABEL = { active: 'aktiv / unklar', contained: 'unter Kontrolle', out: 'gelöscht' };
  const WBI_COLOR = { 1: '#6a994e', 2: '#f2cc45', 3: '#f1a13a', 4: '#d03b3b', 5: '#7a1717' };
  const WBI_LABEL = { 1: 'sehr gering', 2: 'gering', 3: 'mittel', 4: 'hoch', 5: 'sehr hoch' };

  function nearbySatCount(lat, lon, tFirst, tLast) {
    const from = new Date(tFirst).getTime() - 48 * 3.6e6;
    const to = new Date(tLast).getTime() + 24 * 3.6e6;
    return data.points.filter(p => {
      const t = acqDate(p).getTime();
      if (t < from || t > to) return false;
      const dLat = (p.lat - lat) * 111, dLon = (p.lon - lon) * 74;   // km
      return Math.hypot(dLat, dLon) <= 5;
    }).length;
  }

  // ---- Tooltip / Popup -----------------------------------------------------
  // Desktop: Hover-Tooltip (freies DIV) + Klick-Popup.
  // Touch (hover: none): KEIN Tooltip — der volle Tooltip-Inhalt wandert ins
  // Popup, sonst würde ein Tap Hover und Klick gleichzeitig auslösen.
  const tipEl = document.getElementById('hovertip');
  function showTip(html, x, y) {
    tipEl.innerHTML = html;
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
    tipEl.style.display = 'block';
  }
  function hideTip() { tipEl.style.display = 'none'; }

  function openPopup(lngLat, html) {
    // MapLibre-Popups verschieben die Karte nicht automatisch (anders als
    // Leaflets autoPan). Auf schmalen Displays läuft ein Popup am Kartenrand
    // sonst aus dem Bild -> vorher auf den Punkt zentrieren.
    const w = Math.min(320, document.documentElement.clientWidth - 40);
    if (IS_TOUCH || document.documentElement.clientWidth < 520) {
      map.easeTo({ center: lngLat, duration: 250 });
    }
    new maplibregl.Popup({ className: 'fire-popup', closeButton: true, maxWidth: w + 'px', offset: 14 })
      .setLngLat(lngLat).setHTML('<div class="fire-tip">' + html + '</div>').addTo(map);
  }

  // Bindet Tooltip/Popup an einen DOM-Marker (Meldungen, DWD-Stationen)
  function bindMarker(el, lngLat, tipHtml, popupExtra) {
    // stopPropagation ist Pflicht: sonst läuft der Klick weiter zur Karte,
    // MapLibre feuert sein 'click'-Event und schließt das gerade geöffnete
    // Popup sofort wieder (closeOnClick).
    if (IS_TOUCH) {
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        openPopup(lngLat, tipHtml + (popupExtra || ''));
      });
      return;
    }
    el.addEventListener('mouseenter', e => showTip(tipHtml, e.clientX, e.clientY));
    el.addEventListener('mousemove', e => showTip(tipHtml, e.clientX, e.clientY));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      hideTip();
      openPopup(lngLat, tipHtml + (popupExtra || ''));
    });
  }

  // ---- Layer-Definition ----------------------------------------------------
  // GL-Layer (GeoJSON-Quellen) für alles Flächige und für die Satellitenpunkte;
  // DOM-Marker nur dort, wo index.html Emoji-Icons nutzt (Meldungen, DWD) —
  // dafür gibt es in den freien Glyph-Fonts keine Emoji-Glyphen.
  const GEO = {
    footprints: { type: 'FeatureCollection', features: [] },
    areas:      { type: 'FeatureCollection', features: [] },
    fires:      { type: 'FeatureCollection', features: [] },
    scars:      { type: 'FeatureCollection', features: [] }
  };
  let markersVeg = [], markersOther = [], markersWbi = [];

  // Overlays: id -> { label, kind, on }
  const OVERLAYS = [
    { id: 'fires',      label: 'Satelliten-Detektionen (NASA FIRMS)',        on: true },
    { id: 'areas',      label: 'Geschätzte betroffene Flächen (Satellit)',   on: true },
    { id: 'scars',      label: 'Brandnarben (Sentinel-2, dNBR)',             on: true },
    { id: 'footprints', label: 'Detektions-Footprints (Pixelgröße)',         on: false },
    { id: 'repveg',     label: 'Vegetationsbrände (Meldungen)',              on: true },
    { id: 'repother',   label: 'Sonstige Brände (Gebäude/Kfz …)',            on: false },
    { id: 'wbi',        label: 'Waldbrandgefahr heute (DWD-WBI)',            on: false },
    { id: 'effishs',    label: 'Vergleich: offizielle Hotspots (EFFIS)',     on: false },
    { id: 'effisba',    label: 'Vergleich: offizielle Brandflächen (EFFIS)', on: false }
  ];
  // Einmalige Übernahme aus der Leaflet-Karte: dort hieß der Schalter für
  // Gebäude-/Kfz-Brände "firemap.showOther" (Waldfokus). Wer ihn eingeschaltet
  // hatte, soll ihn nach der Umstellung eingeschaltet vorfinden.
  if (localStorage.getItem(LS + 'layer.repother') === null &&
      localStorage.getItem(LS + 'showOther') !== null) {
    localStorage.setItem(LS + 'layer.repother', localStorage.getItem(LS + 'showOther'));
  }
  const vis = {};
  OVERLAYS.forEach(o => {
    const s = localStorage.getItem(LS + 'layer.' + o.id);
    vis[o.id] = s === null ? o.on : s === '1';
  });
  // GL-Layer-IDs pro Overlay (DOM-Marker-Gruppen stehen hier bewusst nicht drin)
  const GL_LAYERS = {
    fires:      ['fires-circle'],
    areas:      ['areas-fill', 'areas-line'],
    scars:      ['scars-fill', 'scars-line'],
    footprints: ['footprints-fill', 'footprints-line'],
    effishs:    ['effis-hs'],
    effisba:    ['effis-ba']
  };

  const EFFIS_WMS = 'https://maps.effis.emergency.copernicus.eu/effis?service=WMS&version=1.1.1&request=GetMap' +
    '&format=image/png&transparent=true&srs=EPSG:3857&width=256&height=256&bbox={bbox-epsg-3857}&layers=';

  function addDataLayers() {
    // Quellen
    Object.keys(GEO).forEach(k => {
      if (!map.getSource(k)) map.addSource(k, { type: 'geojson', data: GEO[k] });
      else map.getSource(k).setData(GEO[k]);
    });
    if (!map.getSource('effis-hs-src')) {
      map.addSource('effis-hs-src', { type: 'raster', tileSize: 256, tiles: [EFFIS_WMS + 'all.hs'],
        attribution: 'Hotspots &copy; <a href="https://forest-fire.emergency.copernicus.eu/" target="_blank" rel="noopener">EFFIS/Copernicus</a>' });
      map.addSource('effis-ba-src', { type: 'raster', tileSize: 256, tiles: [EFFIS_WMS + 'effis.nrt.ba,modis.ba.poly'],
        attribution: 'Brandfl&auml;chen &copy; EFFIS/Copernicus' });
    }

    const add = l => { if (!map.getLayer(l.id)) map.addLayer(l); };

    // EFFIS-Raster ganz unten (direkt über der Basiskarte)
    add({ id: 'effis-ba', type: 'raster', source: 'effis-ba-src', paint: { 'raster-opacity': 0.75 } });
    add({ id: 'effis-hs', type: 'raster', source: 'effis-hs-src', paint: { 'raster-opacity': 0.85 } });

    // Footprints (Pixelgröße der Sensoren)
    add({ id: 'footprints-fill', type: 'fill', source: 'footprints',
      paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.12 } });
    add({ id: 'footprints-line', type: 'line', source: 'footprints',
      paint: { 'line-color': ['get', 'color'], 'line-width': 1 } });

    // Brandnarben (Sentinel-2 dNBR, lila)
    add({ id: 'scars-fill', type: 'fill', source: 'scars',
      paint: { 'fill-color': '#7b1fa2', 'fill-opacity': 0.35 } });
    add({ id: 'scars-line', type: 'line', source: 'scars',
      paint: { 'line-color': '#7b1fa2', 'line-width': 2 } });

    // Geschätzte betroffene Flächen (Union der Footprints)
    add({ id: 'areas-fill', type: 'fill', source: 'areas',
      paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.25 } });
    add({ id: 'areas-line', type: 'line', source: 'areas',
      paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-dasharray': [4, 4] } });

    // Satelliten-Detektionen: Radius = Feuerleistung, Farbe = Alter
    add({ id: 'fires-circle', type: 'circle', source: 'fires',
      paint: {
        'circle-radius': ['get', 'r'],
        'circle-color': ['get', 'color'],
        'circle-opacity': 0.85,
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': ['case', ['get', 'persistent'], 1, 2],
        'circle-stroke-opacity': ['case', ['get', 'persistent'], 0.7, 1]
      } });

    applyVisibility();
    bindGlHandlers();
  }

  function applyVisibility() {
    Object.keys(GL_LAYERS).forEach(k => {
      GL_LAYERS[k].forEach(id => {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis[k] ? 'visible' : 'none');
      });
    });
    syncMarkers(markersVeg, vis.repveg);
    syncMarkers(markersOther, vis.repother);
    syncMarkers(markersWbi, vis.wbi);
  }
  function syncMarkers(list, on) {
    list.forEach(m => { if (on) m.addTo(map); else m.remove(); });
  }

  // Hover/Klick für die GL-Layer (Punkte und Flächen tragen ihr HTML als Property)
  let glBound = false;
  function bindGlHandlers() {
    if (glBound) return;
    glBound = true;
    const targets = ['fires-circle', 'areas-fill', 'scars-fill'];
    targets.forEach(id => {
      if (!IS_TOUCH) {
        map.on('mousemove', id, e => {
          map.getCanvas().style.cursor = 'pointer';
          showTip(e.features[0].properties.tip, e.originalEvent.clientX, e.originalEvent.clientY);
        });
        map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; hideTip(); });
      }
      map.on('click', id, e => {
        hideTip();
        openPopup(e.lngLat, e.features[0].properties.tip);
      });
    });
  }

  // ---- Zeitraum-Filter -----------------------------------------------------
  const RANGES = [
    { days: 1,  label: 'Heute' },
    { days: 3,  label: '3 T' },
    { days: 7,  label: '7 T' },
    { days: 14, label: '14 T' },
    { days: 30, label: '30 T' }
  ];
  let rangeDays = +(localStorage.getItem(LS + 'range') || 14);
  if (!RANGES.some(r => r.days === rangeDays)) rangeDays = 14;

  let legendDiv = null;
  const counts = [0, 0, 0];
  let persistentCount = 0, vegReports = 0, otherReports = 0;

  // Brandnarben ändern sich nicht mit dem Zeitfilter (wie in index.html)
  scarData.scars.forEach(s => {
    GEO.scars.features.push({
      type: 'Feature',
      geometry: s.geojson.type === 'Feature' ? s.geojson.geometry : s.geojson,
      properties: {
        tip: '<div class="tip-head">Brandnarbe (Sentinel-2, dNBR)</div>' +
          '<table><tr><td>Fl&auml;che</td><td>ca. ' + s.ha.toLocaleString('de-DE') + ' ha</td></tr>' +
          '<tr><td>Vorher-Bild</td><td>' + s.preDate + '</td></tr>' +
          '<tr><td>Nachher-Bild</td><td>' + s.postDate + '</td></tr></table>' +
          (s.eventBase ? '<div class="tip-flag">Ereignis: ' + s.eventBase.split('|')[1] + '</div>' : '')
      }
    });
  });

  // DWD-Waldbrandgefahrenindex (unabhängig vom Zeitfilter)
  wbiData.stations.forEach(s => {
    const el = document.createElement('div');
    el.className = 'mk';
    el.innerHTML = '<div style="width:22px;height:22px;border-radius:4px;background:' + WBI_COLOR[s.today] + ';' +
      'border:2px solid #fff;box-shadow:0 0 0 1px rgba(11,11,11,.15);display:flex;align-items:center;' +
      'justify-content:center;font-size:12px;font-weight:700;color:' + (s.today >= 4 || s.today === 1 ? '#fff' : '#0b0b0b') + '">' +
      s.today + '</div>';
    bindMarker(el, [s.lon, s.lat],
      '<div class="tip-head">Waldbrandgefahr (DWD): Stufe ' + s.today + ' — ' + WBI_LABEL[s.today] + '</div>' +
      '<div class="tip-sub">Station ' + s.name + '</div>' +
      '<table><tr><td>Morgen</td><td>Stufe ' + s.tomorrow + ' — ' + WBI_LABEL[s.tomorrow] + '</td></tr>' +
      '<tr><td>Stand</td><td>' + s.issued + ' UTC</td></tr></table>', null);
    markersWbi.push(new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]));
  });

  function rebuild() {
    const cutoff = now - rangeDays * 864e5;
    GEO.footprints.features = [];
    GEO.areas.features = [];
    GEO.fires.features = [];
    markersVeg.forEach(m => m.remove()); markersOther.forEach(m => m.remove());
    markersVeg = []; markersOther = [];
    counts[0] = counts[1] = counts[2] = 0;
    persistentCount = 0; vegReports = 0; otherReports = 0;

    // Satelliten-Detektionen (FIRMS liefert max. 7 Tage)
    const pts = data.points.filter(p => acqDate(p).getTime() >= cutoff);
    pts.slice()
      .sort((a, b) => acqDate(a) - acqDate(b))       // frisch zuletzt = oben
      .forEach(p => {
        const persistent = isPersistent(p);
        const cls = ageClass(p);
        counts[cls]++; if (persistent) persistentCount++;
        const r = Math.max(5, Math.min(18, 4 + 2.2 * Math.sqrt(Math.max(p.frp, 0))));
        GEO.fires.features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [p.lon, p.lat] },
          properties: {
            r: r,
            color: persistent ? '#898781' : AGE[cls].color,
            persistent: persistent,
            tip: tooltipHtml(p, persistent)
          }
        });
      });

    // Footprints + geschätzte Flächen aus den gefilterten Punkten
    const nonPersistent = pts.filter(p => !isPersistent(p));
    nonPersistent.forEach(p => {
      const cls = ageClass(p);
      const f = footprintPolygon(p);
      f.properties = { color: AGE[cls].color };
      GEO.footprints.features.push(f);
    });

    // Cluster benachbarter Detektionen (Union-Find)
    const parent = nonPersistent.map((_, i) => i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    for (let i = 0; i < nonPersistent.length; i++)
      for (let j = i + 1; j < nonPersistent.length; j++) {
        const a = nonPersistent[i], b = nonPersistent[j];
        const dKm = Math.hypot((a.lat - b.lat) * 111, (a.lon - b.lon) * 74);
        // Verknüpfungsdistanz wächst mit der Pixelgröße (am Swath-Rand > 1 km)
        const link = Math.max(1, ((a.scan || 0.375) + (b.scan || 0.375)) / 2);
        if (dKm <= link) parent[find(i)] = find(j);
      }
    const clusters = new Map();
    nonPersistent.forEach((p, i) => {
      const r = find(i);
      if (!clusters.has(r)) clusters.set(r, []);
      clusters.get(r).push(p);
    });

    clusters.forEach(cpts => {
      if (cpts.length < 2) return;
      let union = footprintPolygon(cpts[0]);
      for (let k = 1; k < cpts.length; k++) {
        try { union = turf.union(union, footprintPolygon(cpts[k])); } catch (e) { /* topologie-fehler ignorieren */ }
      }
      const ha = Math.round(turf.area(union) / 10000);
      const dates = cpts.map(p => acqDate(p).getTime());
      const newest = new Date(Math.max.apply(null, dates));
      const oldest = new Date(Math.min.apply(null, dates));
      const cls = AGE.findIndex(a => (now - newest.getTime()) / 3.6e6 <= a.max);
      const maxFrp = Math.max.apply(null, cpts.map(p => p.frp));
      GEO.areas.features.push({
        type: 'Feature',
        geometry: union.geometry,
        properties: {
          color: AGE[cls].color,
          tip: '<div class="tip-head">Gesch&auml;tzte betroffene Fl&auml;che</div>' +
            '<div class="tip-sub">aus ' + cpts.length + ' Satelliten-Detektionen (Pixel-Union, ~375 m Aufl&ouml;sung)</div>' +
            '<table>' +
            '<tr><td>Fl&auml;che (grob)</td><td>ca. ' + ha + ' ha</td></tr>' +
            '<tr><td>Zeitraum</td><td>' + fmtLocal(oldest) + ' – ' + fmtLocal(newest) + '</td></tr>' +
            '<tr><td>Max. Feuerleistung</td><td>' + maxFrp.toFixed(1) + ' MW</td></tr>' +
            '</table>'
        }
      });
    });

    // Einsatzmeldungen — Marker mit identischen Koordinaten leicht spiralig
    // versetzen, damit keiner unsichtbar unter einem anderen liegt
    const stackCount = new Map();
    function unstack(lat, lon) {
      const key = lat.toFixed(3) + '/' + lon.toFixed(3);
      const n = stackCount.get(key) || 0;
      stackCount.set(key, n + 1);
      if (n === 0) return [lat, lon];
      const ang = n * 2.4, r = 0.004 + 0.001 * n;   // Spirale, ~400 m Schritte
      return [lat + r * Math.cos(ang), lon + r * Math.sin(ang) * 1.5];
    }
    // veg=true: kräftiger roter Ring (Vegetationsbrand); sonst neutraler Ring
    function fireIconEl(approx, status, veg) {
      const el = document.createElement('div');
      el.className = 'mk';
      el.innerHTML = '<div style="width:26px;height:26px;border-radius:50%;background:#fcfcfb;' +
        'border:2px ' + (approx ? 'dashed' : 'solid') + ' ' +
        (status === 'out' ? '#898781' : (veg ? '#8f1d1d' : '#52514e')) + ';' +
        'box-shadow:0 1px 4px rgba(11,11,11,.25);display:flex;align-items:center;justify-content:center;' +
        'font-size:14px;' + (status === 'out' ? 'filter:grayscale(1);opacity:.7' : '') + '">🔥</div>';
      return el;
    }

    reportData.reports
      .filter(rep => new Date(rep.last).getTime() >= cutoff)
      .forEach(rep => {
        if (rep.veg) { vegReports++; } else { otherReports++; }
        rep.places.forEach(pl => {
          const satN = nearbySatCount(pl.lat, pl.lon, rep.first, rep.last);
          const tip = '<div class="tip-head">' + (rep.veg ? 'Vegetationsbrand' : 'Brand') + ' — Einsatzmeldung</div>' +
            '<div class="tip-sub">' + rep.title + '</div>' +
            '<table>' +
            '<tr><td>Ort</td><td>' + pl.name +
              (pl.approx ? ' <i>(ungef&auml;hr)</i>'
                         : (/kreis$/i.test(pl.name) ? ' <i>(nur Kreis-Ebene bekannt)</i>' : '')) + '</td></tr>' +
            '<tr><td>Status</td><td>' + (STATUS_LABEL[rep.status] || rep.status) + '</td></tr>' +
            '<tr><td>Gemeldet</td><td>' + fmtLocal(new Date(rep.first)) + '</td></tr>' +
            (rep.updates ? '<tr><td>Folgemeldungen</td><td>' + rep.updates + '</td></tr>' : '') +
            '<tr><td>Quelle</td><td>' + rep.source + ' (ots)</td></tr>' +
            '<tr><td>Satellit</td><td>' + (satN ? satN + ' Detektion(en) in der N&auml;he'
                                                : 'keine — nur lokal gemeldet') + '</td></tr>' +
            '</table>';
          const linkHtml = '<div style="margin-top:6px"><b><a href="' + rep.link + '" target="_blank" rel="noopener">Pressemeldung lesen</a></b></div>';
          const ll = unstack(pl.lat, pl.lon);
          const lngLat = [ll[1], ll[0]];
          const el = fireIconEl(pl.approx || /kreis$/i.test(pl.name), rep.status, rep.veg);
          bindMarker(el, lngLat, tip, linkHtml);
          const m = new maplibregl.Marker({ element: el }).setLngLat(lngLat);
          (rep.veg ? markersVeg : markersOther).push(m);
        });
      });

    // GL-Quellen aktualisieren (nur wenn der Stil schon geladen ist)
    if (map.isStyleLoaded() || map.getSource('fires')) {
      ['footprints', 'areas', 'fires', 'scars'].forEach(k => {
        const src = map.getSource(k);
        if (src) src.setData(GEO[k]);
      });
    }
    syncMarkers(markersVeg, vis.repveg);
    syncMarkers(markersOther, vis.repother);
    renderLegend();
  }

  function renderLegend() {
    if (!legendDiv) return;
    legendDiv.innerHTML = '<button class="mob-toggle" aria-label="Legende ein-/ausblenden" title="Legende">☰</button>' +
      '<h1>Zeitraum: ' + rangeDays + ' Tag' + (rangeDays > 1 ? 'e' : '') + '</h1>' +
      AGE.map((a, i) =>
        '<div class="row"><span class="dot" style="background:' + a.color + '"></span>' +
        '<span class="label">Detektion ' + a.label + ' (' + counts[i] + ')</span></div>'
      ).join('') +
      '<div class="row"><span class="dot dashed" style="background:#898781"></span>' +
      '<span class="label">dauerhafte Wärmequelle / Industrie (' + persistentCount + ')</span></div>' +
      '<div class="row"><span style="font-size:14px;flex:none;filter:drop-shadow(0 0 1px #8f1d1d)">🔥</span>' +
      '<span class="label">Vegetationsbrand-Meldung (' + vegReports + ')</span></div>' +
      '<div class="row"><span style="font-size:14px;flex:none;filter:grayscale(.6)">🔥</span>' +
      '<span class="label">sonstiger Brand — Geb&auml;ude/Kfz (' + otherReports + ', zuschaltbar)</span></div>' +
      '<div class="row"><span class="dot" style="background:rgba(143,29,29,.25);border:2px dashed #8f1d1d;border-radius:4px"></span>' +
      '<span class="label">geschätzte betroffene Fläche</span></div>' +
      '<div class="row"><span class="dot" style="background:rgba(123,31,162,.35);border:2px solid #7b1fa2;border-radius:4px"></span>' +
      '<span class="label">Brandnarbe Sentinel-2 (' + scarData.scars.length + ')</span></div>' +
      '<div class="size-hint">Kreisgröße = Feuerleistung (FRP in MW).<br>' +
      'Satellitendaten reichen max. 7 Tage zurück.<br>' +
      'Graues 🔥 = gemeldet als gelöscht.</div>';
  }

  // ---- Bedienelemente ------------------------------------------------------
  // Auf Mobile: Panels per Icon ein-/ausklappen; beim Öffnen die anderen
  // schließen, damit die Karte frei bleibt
  function toggleCollapse(div) {
    const wasOpen = !div.classList.contains('collapsed');
    if (wasOpen) { div.classList.add('collapsed'); return; }
    document.querySelectorAll('.mob-collapsible').forEach(p => p.classList.add('collapsed'));
    div.classList.remove('collapsed');
  }
  // Minimal-IControl: MapLibre erwartet nur onAdd/onRemove
  function ctrl(el) { return { onAdd: () => el, onRemove: () => el.remove() }; }
  function stopMapEvents(el) {
    ['mousedown', 'dblclick', 'touchstart', 'wheel', 'click'].forEach(ev =>
      el.addEventListener(ev, e => e.stopPropagation()));
  }

  // Info-Panel oben links
  const infoDiv = document.createElement('div');
  infoDiv.className = 'maplibregl-ctrl panel mob-collapsible';
  stopMapEvents(infoDiv);
  if (isMobile()) infoDiv.classList.add('collapsed');
  infoDiv.addEventListener('click', e => { if (e.target.closest('.mob-toggle')) toggleCollapse(infoDiv); });
  infoDiv.innerHTML =
    '<button class="mob-toggle" aria-label="Info ein-/ausblenden" title="Info">ℹ️</button>' +
    '<h1 style="font-size:13px">Feuerkarte Baden-Württemberg</h1>' +
    '<div class="meta"><b>' + reportData.reports.filter(r => r.status === 'active').length +
    '</b> gemeldete Br&auml;nde ohne L&ouml;sch-Best&auml;tigung (30 Tage)' +
    '<br>Satellit: <b>' + data.generated + '</b> &middot; Meldungen: <b>' + (reportData.generated || '–') + '</b>' +
    (function () {   // Stale-Hinweis, falls die Satelliten-Pipeline länger hängt
      const t = Date.parse((data.generated || '').replace(' UTC', 'Z').replace(' ', 'T'));
      return (t && (Date.now() - t) > 6 * 3.6e6)
        ? '<br><span style="color:#b45309">⚠ Satellitendaten derzeit &auml;lter als 6 h</span>' : '';
    })() + '</div>' +
    '<div class="meta" style="margin-top:5px;color:#898781">Keine amtliche Warnung, Angaben ohne Gew&auml;hr ' +
    '(<a href="hinweise.html" style="color:#8f1d1d">Quellen</a>). Notfall: 112.</div>' +
    ((reportData.nina && reportData.nina.length)
      ? '<div style="margin-top:8px;padding:6px 8px;border-radius:6px;background:#fbe9e7;border:1px solid #d03b3b;font-size:12px">' +
        '<b>Amtliche Warnungen (NINA):</b><br>' +
        reportData.nina.map(w => w.region + ': ' + w.headline).join('<br>') + '</div>'
      : '');
  map.addControl(ctrl(infoDiv), 'top-left');

  // Zeitraum-Auswahl (Presets, Standard: 14 Tage)
  const rangeDiv = document.createElement('div');
  rangeDiv.className = 'maplibregl-ctrl panel range-ctl mob-collapsible';
  stopMapEvents(rangeDiv);
  if (isMobile()) rangeDiv.classList.add('collapsed');
  rangeDiv.innerHTML = '<button class="mob-toggle" aria-label="Zeitraum-Filter ein-/ausblenden" title="Zeitraum">🕒</button>' +
    '<span class="lbl">Zeitraum</span>' + RANGES.map(r =>
      '<button class="range-btn' + (r.days === rangeDays ? ' active' : '') + '" data-days="' + r.days + '">' + r.label + '</button>'
    ).join('');
  rangeDiv.addEventListener('click', e => {
    if (e.target.closest('.mob-toggle')) { toggleCollapse(rangeDiv); return; }
    const btn = e.target.closest('.range-btn');
    if (!btn) return;
    rangeDays = +btn.dataset.days;
    localStorage.setItem(LS + 'range', rangeDays);
    rangeDiv.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', +b.dataset.days === rangeDays));
    rebuild();
  });
  map.addControl(ctrl(rangeDiv), 'top-left');

  // Layer-Menü unten links (eingeklappt), Nachbau des Leaflet-Layer-Controls
  const layerDiv = document.createElement('div');
  layerDiv.className = 'maplibregl-ctrl panel layer-ctl';
  stopMapEvents(layerDiv);
  layerDiv.innerHTML =
    '<button class="lc-toggle" aria-label="Layer-Menü öffnen" title="Layer">🗂️</button>' +
    '<div class="lc-body">' +
      '<div class="lc-head"><span>Karte &amp; Ebenen</span><button class="lc-close" aria-label="Layer-Menü schließen">✕</button></div>' +
      '<div class="lc-group"><div class="lc-title">Kartenstil</div>' +
        Object.keys(STYLES).map(k =>
          '<label><input type="radio" name="basestyle" value="' + k + '"' +
          (k === styleChoice ? ' checked' : '') + '><span>' + STYLES[k].label + '</span></label>').join('') +
      '</div>' +
      '<div class="lc-group"><div class="lc-title">Ebenen</div>' +
        OVERLAYS.map(o =>
          '<label><input type="checkbox" data-ov="' + o.id + '"' +
          (vis[o.id] ? ' checked' : '') + '><span>' + o.label + '</span></label>').join('') +
      '</div>' +
    '</div>';
  layerDiv.querySelector('.lc-toggle').addEventListener('click', () => layerDiv.classList.add('open'));
  layerDiv.querySelector('.lc-close').addEventListener('click', () => layerDiv.classList.remove('open'));
  layerDiv.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'basestyle') { setBaseStyle(t.value); return; }
    if (t.dataset.ov) {
      vis[t.dataset.ov] = t.checked;
      localStorage.setItem(LS + 'layer.' + t.dataset.ov, t.checked ? '1' : '0');
      applyVisibility();
    }
  });
  map.addControl(ctrl(layerDiv), 'bottom-left');

  // Legende unten rechts
  legendDiv = document.createElement('div');
  legendDiv.className = 'maplibregl-ctrl panel legend mob-collapsible';
  stopMapEvents(legendDiv);
  if (isMobile()) legendDiv.classList.add('collapsed');
  legendDiv.addEventListener('click', e => { if (e.target.closest('.mob-toggle')) toggleCollapse(legendDiv); });
  map.addControl(ctrl(legendDiv), 'bottom-right');

  // ---- Stilwechsel ---------------------------------------------------------
  function setBaseStyle(key) {
    if (!STYLES[key]) return;
    styleChoice = key;
    localStorage.setItem(LS + 'style', key);
    glBound = false;                       // Handler hängen am Stil, neu binden
    map.setStyle(STYLES[key].url || STYLES[key].build());
  }

  // Nach jedem Stilwechsel: Globus + Atmosphäre setzen und Daten neu anlegen
  // (setStyle wirft alle eigenen Quellen und Layer weg).
  map.on('style.load', () => {
    // Globus-Projektion — muss nach dem Laden des Stils gesetzt werden.
    try { map.setProjection({ type: 'globe' }); } catch (e) { console.warn('Globus nicht verfügbar:', e); }
    // Fremdstile (Liberty) bringen kein sky mit -> Atmosphäre nachrüsten
    try { if (!map.getStyle().sky) map.setSky(skyFor(PAL.hell)); } catch (e) { /* optional */ }
    // Fremdstile: POI-Layer defensiv entfernen, falls doch mal einer aktiv ist
    // (bei "Bunt / Detail" bewusst NICHT — dort sind POIs der Vergleichszweck)
    addDataLayers();
  });

  rebuild();

  // Für den automatisierten Playwright-Check (scripts/globe-check.mjs) —
  // erlaubt dem Testskript, auf map.loaded() zu warten und gezielt zu zoomen.
  window.__globeMap = map;
  window.__fireMap = map;

  // Seite alle 15 Minuten neu laden (der Cloud-Scheduler aktualisiert die
  // Datendateien; Zeitraum, Stil und Ebenen bleiben via localStorage erhalten)
  setTimeout(function () { location.reload(); }, 15 * 60 * 1000);
})();
</script>
