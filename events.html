<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventkarte Freiburg &amp; Umgebung</title>
<meta property="og:image" content="https://map.aleduwa.de/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://map.aleduwa.de/og-image.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --muted:      #898781;
    --surface:    #fcfcfb;
    --hairline:   rgba(11,11,11,0.10);
  }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface);
    height: 100dvh; overflow: hidden; }
  #map { height: 100%; }

  /* Touch: kein Tap-Blitzen, kein Doppeltipp-Zoom auf Bedienelementen */
  .mode-switch a, .view-switch button, .range-btn, .chip, .legend .row,
  .lv-table th, .lv-filters select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(11,11,11,0.12);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 280px;
  }
  .panel h1 { font-size: 14px; margin: 0 0 4px; font-weight: 650; }
  .panel .meta { color: var(--ink-2); font-size: 12px; }
  .panel .meta b { color: var(--ink); font-weight: 600; }

  .range-ctl { display: flex; gap: 4px; padding: 6px; flex-wrap: wrap; }
  .range-ctl .lbl { font-size: 11.5px; color: var(--ink-2); align-self: center; padding: 0 4px 0 2px; }
  .scope-ctl input {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 6px; font-size: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink); width: 52px;
  }
  .scope-ctl .center-lbl { font-size: 11.5px; color: var(--ink-2); align-self: center; padding: 0 2px; max-width: 130px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scope-ctl .hint { flex-basis: 100%; font-size: 11px; color: #d03b3b; padding: 2px 2px 0; }
  .range-btn {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .range-btn:hover { background: #f1f0ec; }
  .range-btn.active { background: #8f1d1d; border-color: #8f1d1d; color: #fff; font-weight: 600; }

  .legend .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; user-select: none; }
  .legend .row:hover .label { color: var(--ink); }
  .legend .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--hairline); flex: none; }
  .legend .label { color: var(--ink-2); font-size: 12px; }
  .legend .row.off { opacity: 0.45; }
  .legend .row.off .label { text-decoration: line-through; }
  .legend .row.off .dot { background: transparent !important; box-shadow: inset 0 0 0 2px var(--muted); border-color: transparent; }
  .legend .size-hint { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--muted); font-size: 11.5px; }

  .leaflet-tooltip.evt-tip {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(11,11,11,0.18);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
    /* width:max-content verhindert das "Hochkant"-Schrumpfen absolut
       positionierter Tooltips: erst die natürliche Zeilenbreite nehmen,
       dann bei max-width umbrechen */
    width: max-content;
    max-width: min(340px, 82vw);
    white-space: normal;
  }
  .evt-tip .tip-head { font-weight: 650; margin-bottom: 2px; max-width: 320px; }
  .evt-tip .tip-sub { color: var(--ink-2); }
  .evt-tip .tip-flag { color: var(--muted); font-style: italic; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .evt-tip table { border-collapse: collapse; margin-top: 4px; }
  .evt-tip td { padding: 0 0 1px; color: var(--ink); vertical-align: top; }
  .evt-tip td:first-child { color: var(--ink-2); padding-right: 10px; white-space: nowrap; }

  .leaflet-control-attribution { font-size: 10px; }

  /* Einklapp-Buttons der Karten-Panels: nur auf Mobile sichtbar */
  .mob-toggle { display: none; }

  .mode-switch { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1001; display:flex; background:#fcfcfb; border:1px solid rgba(11,11,11,.1); border-radius:8px; box-shadow:0 1px 4px rgba(11,11,11,.12); overflow:hidden; }
  .mode-switch a { padding:6px 14px; font-size:13px; text-decoration:none; color:#52514e; }
  .mode-switch a.active { background:#8f1d1d; color:#fff; font-weight:600; }
  .mode-switch a:not(.active):hover { background:#f1f0ec; }

  /* Umschalter Karte/Liste */
  .view-switch { position: absolute; top: 10px; right: 10px; z-index: 1101; display: flex;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: 0 1px 4px rgba(11,11,11,.12); overflow: hidden; }
  .view-switch button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 14px;
    font-size: 13px; cursor: pointer; font-family: inherit; }
  .view-switch button.active { background: #8f1d1d; color: #fff; font-weight: 600; }
  .view-switch button:not(.active):hover { background: #f1f0ec; }

  /* Listenansicht */
  #listview { position: absolute; inset: 52px 10px 10px 10px; z-index: 1100; display: none;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(11,11,11,0.15); overflow: hidden; flex-direction: column; }
  #listview.open { display: flex; }
  .lv-filters { padding: 10px 12px; border-bottom: 1px solid var(--hairline);
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; }
  .lv-filters .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .lv-filters .glbl { color: var(--ink-2); font-size: 11.5px; margin-right: 2px; }
  .chip {
    border: 1px solid var(--hairline); background: var(--surface); color: var(--ink-2);
    border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: #f1f0ec; }
  .chip.active { background: #8f1d1d; border-color: #8f1d1d; color: #fff; font-weight: 600; }
  .lv-filters input[type="search"] {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 8px; font-size: 12.5px;
    font-family: inherit; background: var(--surface); color: var(--ink); width: 170px;
  }
  .lv-filters select {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 6px; font-size: 12.5px;
    font-family: inherit; background: var(--surface); color: var(--ink-2);
  }
  .lv-filters input[type="range"] { width: 110px; accent-color: #8f1d1d; vertical-align: middle; }
  .lv-count { color: var(--ink-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .lv-count b { color: var(--ink); }

  .lv-tablewrap { overflow: auto; flex: 1; }
  .lv-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .lv-table th, .lv-table td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  .lv-table td.t-title { white-space: normal; min-width: 180px; max-width: 420px; }
  .lv-table td.t-place { white-space: normal; max-width: 220px; color: var(--ink-2); }
  .lv-table th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2);
    font-weight: 600; font-size: 11.5px; cursor: pointer; user-select: none; z-index: 1;
    border-bottom: 2px solid var(--hairline); }
  .lv-table th:hover { color: var(--ink); }
  .lv-table th .arr { font-size: 9px; }
  .lv-table a { color: #8f1d1d; text-decoration: none; }
  .lv-table a:hover { text-decoration: underline; }
  .lv-table tr:hover td { background: #f7f6f3; }
  .lv-more { padding: 10px 12px; color: var(--muted); font-size: 12px; text-align: center; }

  /* Info-Panel: auf Desktop immer offen; Einklapp-Verhalten nur mobil (s. Media Query) */
  .info-panel h1 { cursor: default; }

  @media (max-width: 640px) {
    /* Obere Umschalter: kompakter, aber Touch-Ziele >= 36px */
    .mode-switch a, .view-switch button { padding: 9px 10px; font-size: 12.5px; }

    /* Zoom-Control ausblenden (Pinch-Zoom reicht), topleft-Controls unter die Umschalter schieben */
    .leaflet-control-zoom { display: none; }
    .leaflet-top.leaflet-left { top: 44px; }
    .leaflet-left .leaflet-control { margin-left: 8px; margin-top: 8px; }
    .leaflet-bottom .leaflet-control { margin-bottom: 8px; margin-right: 8px; }

    /* Panels kompakter */
    .panel { max-width: 230px; padding: 8px 10px; }
    .panel.range-ctl { max-width: calc(100vw - 20px); padding: 5px 6px; }
    .range-btn { padding: 8px 10px; font-size: 13px; min-height: 36px; }
    .scope-ctl input { font-size: 16px; padding: 4px 8px; width: 64px; } /* 16px: verhindert iOS-Zoom */
    .scope-ctl .center-lbl { max-width: 105px; }

    /* Info-Panel einklappbar (initial eingeklappt, s. JS) */
    .info-panel h1 { cursor: pointer; }
    .info-panel h1::after { content: " ▾"; color: var(--muted); font-size: 11px; }
    .info-panel.collapsed h1 { margin-bottom: 0; }
    .info-panel.collapsed h1::after { content: " ▸"; }
    .info-panel.collapsed .meta { display: none; }

    /* Legende: kompakt, scrollbar statt riesig */
    .legend { max-width: 190px; max-height: 36vh; overflow-y: auto; overscroll-behavior: contain; }
    .legend .row { margin-top: 2px; padding: 4px 0; }
    .legend .size-hint { display: none; }

    /* Panels zu Icons einklappbar (Zeitraum/Umkreis/Kategorien) — mehr Platz
       für die Karte; immer nur ein Panel offen (s. JS toggleCollapse) */
    .mob-toggle { display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: 0; background: transparent; padding: 0;
      font-size: 18px; line-height: 1; cursor: pointer; flex: none; font-family: inherit; }
    .mob-collapsible.collapsed { width: 42px; height: 42px; padding: 3px; overflow: hidden;
      max-width: 42px; }
    .mob-collapsible.collapsed > *:not(.mob-toggle) { display: none !important; }
    .legend.mob-collapsible.collapsed { max-height: 42px; }

    /* Listenansicht: volle Fläche, Filter als horizontale Scroll-Leiste */
    #listview { inset: 48px 0 0 0; border-radius: 0; border: 0; border-top: 1px solid var(--hairline); }
    .lv-filters { flex-wrap: nowrap; overflow-x: auto; gap: 6px 10px; padding: 8px 10px;
      -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
    .lv-filters .group { flex-wrap: nowrap; flex: none; }
    .lv-filters .glbl { white-space: nowrap; }
    .chip { padding: 8px 10px; font-size: 13px; min-height: 36px; white-space: nowrap; }
    .lv-filters input[type="search"] { font-size: 16px; width: 150px; padding: 5px 8px; } /* 16px: verhindert iOS-Zoom */
    .lv-filters select { font-size: 14px; padding: 6px; min-height: 36px; }
    .lv-count { padding-right: 4px; }
    .lv-tablewrap { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .lv-table th, .lv-table td { padding: 9px 10px; }
    .lv-table td.t-title { min-width: 160px; }
  }

  /* Sehr schmal: Umschalter nur mit Emoji, damit Mitte und rechts nicht kollidieren */
  @media (max-width: 560px) {
    .mode-switch .sw-txt { display: none; }
    .mode-switch a { padding: 9px 12px; }
  }
  @media (max-width: 400px) {
    .view-switch .sw-txt { display: none; }
    .view-switch button { padding: 9px 12px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="mode-switch"><a href="index.html" aria-label="Feuerkarte">🔥<span class="sw-txt"> Feuerkarte</span></a><a href="events.html" class="active" aria-label="Eventkarte">🎉<span class="sw-txt"> Eventkarte</span></a></div>
<div class="view-switch"><button id="btn-map" class="active" aria-label="Karte">🗺️<span class="sw-txt"> Karte</span></button><button id="btn-list" aria-label="Liste">📋<span class="sw-txt"> Liste</span></button></div>

<div id="listview">
  <div class="lv-filters">
    <span class="group" id="lv-range"><span class="glbl">Zeitraum</span></span>
    <span class="group" id="lv-cats"><span class="glbl">Kategorie</span></span>
    <span class="group"><span class="glbl">Suche</span><input type="search" id="lv-search" placeholder="Titel oder Ort …"></span>
    <span class="group" id="lv-radius-group"><span class="glbl" id="lv-radius-lbl">Umkreis</span></span>
    <span class="group" id="lv-days"><span class="glbl">Tag</span></span>
    <span class="group"><span class="glbl">Quelle</span><select id="lv-source"><option value="">alle</option></select></span>
    <span class="lv-count" id="lv-count"></span>
  </div>
  <div class="lv-tablewrap">
    <table class="lv-table">
      <thead><tr id="lv-head"></tr></thead>
      <tbody id="lv-body"></tbody>
    </table>
    <div class="lv-more" id="lv-more" style="display:none"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/veranstaltungen.js"></script>
<script>
(function () {
  const map = L.map('map', { zoomControl: true });
  // Freiburg +50 km
  map.fitBounds(L.latLngBounds([47.45, 7.1], [48.55, 8.6]).pad(0.02));

  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · ' +
      'Events: <a href="https://www.tourismus-bw.de/">toubiz/Open Data BW</a>, ' +
      '<a href="https://veranstaltungen.freiburg.de/">FWTM</a>, ' +
      '<a href="https://rausgegangen.de/freiburg/">Rausgegangen</a>, ' +
      '<a href="https://freiburg.szene-radar.de/">szene-Radar</a>, ' +
      '<a href="https://www.alemannische-seiten.de/">Alemannische Seiten</a>, ' +
      '<a href="https://www.heuboden.de/">Heuboden</a>'
  }).addTo(map);

  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="hinweise.html">Hinweise</a>');

  // ---- Daten & Kategorien -------------------------------------------------
  const data = window.EVENT_DATA || { events: [], generated: '–' };

  const CATS = {
    fest:      { emoji: '🎪', label: 'Fest',      color: '#c2410c' },
    party:     { emoji: '🎉', label: 'Party',     color: '#db2777' },
    musik:     { emoji: '🎵', label: 'Musik',     color: '#7c3aed' },
    markt:     { emoji: '🛍️', label: 'Markt',     color: '#b45309' },
    kultur:    { emoji: '🎭', label: 'Kultur',    color: '#0e7490' },
    sport:     { emoji: '⚽', label: 'Sport',     color: '#15803d' },
    sonstiges: { emoji: '📌', label: 'Sonstiges', color: '#898781' }
  };
  const catOf = e => CATS[e.cat] ? e.cat : 'sonstiges';

  // Kategorie-Sichtbarkeit (Legende klickbar); Kultur ist standardmäßig aus
  let activeCats = null;
  try { activeCats = JSON.parse(localStorage.getItem('eventmap.cats')); } catch (e) { }
  if (!activeCats || typeof activeCats !== 'object') activeCats = null;
  if (!activeCats) {
    activeCats = {};
    Object.keys(CATS).forEach(c => activeCats[c] = (c !== 'kultur'));
  }
  Object.keys(CATS).forEach(c => { if (typeof activeCats[c] !== 'boolean') activeCats[c] = (c !== 'kultur'); });

  // start/end kommen als "yyyy-MM-dd" oder "yyyy-MM-ddTHH:mm" (Lokalzeit
  // Europe/Berlin). Wir bauen daraus lokale Date-Objekte aus Komponenten.
  function parseLocal(s) {
    if (!s) return null;
    const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10),
                       s.length > 10 ? +s.slice(11, 13) : 0,
                       s.length > 10 ? +s.slice(14, 16) : 0);
    return isNaN(d) ? null : d;
  }
  const hasTime = s => !!s && s.length > 10;

  function fmtDate(s) {
    const d = parseLocal(s);
    if (!d) return '–';
    let out = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
    if (hasTime(s)) {
      out += ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
    }
    return out;
  }

  // ---- Umkreis: Zentrum (Standard Waldkirch) + Radius ---------------------
  const DEFAULT_CENTER = { lat: 48.0938, lon: 7.9607, label: 'Waldkirch' };
  const RADII = [10, 25, 50, 0];   // 0 = alle
  let center = null;
  try { center = JSON.parse(localStorage.getItem('eventmap.center')); } catch (e) { }
  if (!center || typeof center.lat !== 'number' || typeof center.lon !== 'number' || !center.label) center = DEFAULT_CENTER;
  let radiusKm = +(localStorage.getItem('eventmap.radius') || 25);
  if (!RADII.includes(radiusKm)) radiusKm = 25;

  // Entfernung vom gewählten Zentrum in km
  function distKm(lat, lon) {
    const dLat = (lat - center.lat) * 111;
    const dLon = (lon - center.lon) * 111 * Math.cos(center.lat * Math.PI / 180);
    return Math.sqrt(dLat * dLat + dLon * dLon);
  }

  function radiusLabel() { return radiusKm ? '≤ ' + radiusKm + ' km' : 'alle'; }

  function setRadius(km) {
    radiusKm = km;
    localStorage.setItem('eventmap.radius', String(km));
    updateScopeUIs();
    fitToScope();
    rebuild();
  }

  function setCenter(c) {
    center = c;
    localStorage.setItem('eventmap.center', JSON.stringify(c));
    updateScopeUIs();
    fitToScope();
    rebuild();
  }

  function fitToScope() {
    if (radiusKm) {
      map.fitBounds(L.latLng(center.lat, center.lon).toBounds(radiusKm * 2000).pad(0.05));
    } else {
      map.fitBounds(L.latLngBounds([47.45, 7.1], [48.55, 8.6]).pad(0.02));
    }
  }

  // PLZ -> Koordinaten (Nominatim, nur auf Nutzeraktion; OSM-Attribution vorhanden)
  function setCenterFromPlz(plz, hintEl) {
    if (!/^\d{5}$/.test(plz)) { if (hintEl) hintEl.textContent = 'Bitte 5-stellige PLZ eingeben.'; return; }
    if (hintEl) hintEl.textContent = 'Suche PLZ ' + plz + ' …';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&postalcode=' + encodeURIComponent(plz))
      .then(r => r.json())
      .then(res => {
        if (!res.length) { if (hintEl) hintEl.textContent = 'PLZ nicht gefunden.'; return; }
        const lat = +res[0].lat, lon = +res[0].lon;
        if (lat < 47.2 || lat > 48.8 || lon < 6.8 || lon > 8.9) {
          if (hintEl) hintEl.textContent = 'PLZ liegt außerhalb des Kartengebiets.';
          return;
        }
        if (hintEl) hintEl.textContent = '';
        setCenter({ lat: lat, lon: lon, label: 'PLZ ' + plz });
      })
      .catch(() => { if (hintEl) hintEl.textContent = 'PLZ-Suche derzeit nicht erreichbar.'; });
  }

  // ---- Zeitraum-Filter (Zukunft) -----------------------------------------
  const RANGES = [
    { key: 'today',   label: 'Heute' },
    { key: 'weekend', label: 'Wochenende' },
    { key: '7',       label: '7 T' },
    { key: '30',      label: '30 T' },
    { key: '90',      label: '90 T' }
  ];
  let rangeKey = localStorage.getItem('eventmap.range') || 'weekend';
  if (!RANGES.some(r => r.key === rangeKey)) rangeKey = 'weekend';

  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  function rangeBounds(key) {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (key === 'today') return [start, addDays(start, 1)];
    if (key === 'weekend') {
      // kommendes Sa+So; läuft das Wochenende schon, dann heute bis So
      const dow = start.getDay();                 // 0 = So, 6 = Sa
      const from = (dow === 6 || dow === 0) ? start : addDays(start, 6 - dow);
      const sunday = (dow === 0) ? start : addDays(from, (from.getDay() === 6) ? 1 : 0);
      return [from, addDays(sunday, 1)];
    }
    return [start, addDays(start, +key)];
  }

  function rangeLabel(key) {
    const [from, to] = rangeBounds(key);
    const f = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    const last = addDays(to, -1);
    return f(from) === f(last) ? f(from) : f(from) + ' – ' + f(last);
  }

  function inRangeEvents() {
    const [from, to] = rangeBounds(rangeKey);
    return data.events.filter(e => {
      const s = parseLocal(e.start);
      if (!s) return false;
      const en = parseLocal(e.end) || s;
      if (!(s < to && en >= from)) return false;
      if (radiusKm && distKm(e.lat, e.lon) > radiusKm) return false;
      return true;
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- Karte: Marker ------------------------------------------------------
  const eventsLayer = L.layerGroup().addTo(map);
  const scopeLayer = L.layerGroup().addTo(map);

  function renderScope() {
    scopeLayer.clearLayers();
    L.marker([center.lat, center.lon], {
      icon: L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 20],
        html: '<div style="font-size:20px;line-height:1;text-shadow:0 1px 2px rgba(11,11,11,.3)">📍</div>' }),
      interactive: false, keyboard: false
    }).addTo(scopeLayer);
    if (radiusKm) {
      L.circle([center.lat, center.lon], {
        radius: radiusKm * 1000, color: '#8f1d1d', weight: 1.5, dashArray: '6 6',
        fill: false, opacity: 0.55, interactive: false
      }).addTo(scopeLayer);
    }
  }
  let legendDiv = null, infoDiv = null;
  let counts = {}, shownGroups = 0, shownDates = 0;

  const evtIcon = cat => L.divIcon({
    className: '', iconSize: [28, 28], iconAnchor: [14, 14],
    html: '<div style="width:28px;height:28px;border-radius:50%;background:#fcfcfb;' +
          'border:2px solid ' + CATS[cat].color + ';' +
          'box-shadow:0 1px 4px rgba(11,11,11,.25);display:flex;align-items:center;justify-content:center;' +
          'font-size:14px;line-height:1">' + CATS[cat].emoji + '</div>'
  });

  function rebuild() {
    eventsLayer.clearLayers();
    counts = {}; Object.keys(CATS).forEach(c => counts[c] = 0);
    shownGroups = 0; shownDates = 0;

    const inRange = inRangeEvents();
    shownDates = inRange.length;

    // Gleiches Event (Titel + Ort) mit mehreren Terminen -> EIN Marker
    const groups = new Map();
    inRange.forEach(e => {
      const key = e.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim() +
                  '|' + e.lat.toFixed(4) + '|' + e.lon.toFixed(4);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    });

    // Sichtbare Veranstaltungen einsammeln (Zähler = Gesamtzahl im Zeitraum)
    const visible = [];
    groups.forEach(list => {
      list.sort((a, b) => a.start < b.start ? -1 : 1);
      const cat = catOf(list[0]);
      counts[cat]++;
      if (!activeCats[cat]) return;        // ausgeblendete Kategorie
      shownGroups++;
      visible.push(list);
    });

    // Veranstaltungen am SELBEN Ort (~11 m) zu einem Venue-Marker bündeln —
    // Marker bleiben exakt auf der Event-Position (keine künstliche Spirale)
    const venues = new Map();
    visible.forEach(list => {
      const e = list[0];
      const key = e.lat.toFixed(4) + '/' + e.lon.toFixed(4);
      if (!venues.has(key)) venues.set(key, []);
      venues.get(key).push(list);
    });

    venues.forEach(lists => {
      if (lists.length === 1) {
        addSingleMarker(lists[0]);
      } else {
        addVenueMarker(lists);
      }
    });

    function addSingleMarker(list) {
      const e = list[0];
      const cat = catOf(e);
      const more = list.length - 1;
      const tip = '<div class="tip-head">' + esc(e.title) + '</div>' +
        (e.place ? '<div class="tip-sub">' + esc(e.place) + '</div>' : '') +
        '<table>' +
        '<tr><td>Wann</td><td>' + fmtDate(e.start) +
          (e.end && e.end.slice(0, 10) !== e.start.slice(0, 10) ? ' – ' + fmtDate(e.end) : '') +
          (more > 0 ? '<br><i>+ ' + more + ' weitere' + (more > 1 ? ' Termine' : 'r Termin') + '</i>' : '') + '</td></tr>' +
        '<tr><td>Kategorie</td><td>' + CATS[cat].emoji + ' ' + CATS[cat].label + '</td></tr>' +
        '<tr><td>Quelle</td><td>' + esc(e.source) + '</td></tr>' +
        '</table>' +
        (e.desc ? '<div class="tip-flag">' + esc(e.desc) + '</div>' : '') +
        '<div class="tip-flag">Klicken f&uuml;r Details &amp; Link</div>';

      const dateList = list.slice(0, 6).map(x => fmtDate(x.start)).join('<br>') +
        (list.length > 6 ? '<br>…' : '');
      const popup = '<b>' + esc(e.title) + '</b>' +
        (e.place ? '<br>' + esc(e.place) : '') +
        '<br>' + dateList +
        '<br><a href="' + esc(e.url) + '" target="_blank" rel="noopener">Zur Veranstaltungsseite (' + esc(e.source) + ')</a>';

      L.marker([e.lat, e.lon], { icon: evtIcon(cat) })
        .bindTooltip(tip, { className: 'evt-tip', sticky: true, direction: 'top', offset: [0, -12] })
        .bindPopup(popup)
        .addTo(eventsLayer);
    }

    function addVenueMarker(lists) {
      lists.sort((a, b) => a[0].start < b[0].start ? -1 : 1);
      const first = lists[0][0];
      // dominante Kategorie bestimmt die Randfarbe
      const catCount = {};
      lists.forEach(l => { const c = catOf(l[0]); catCount[c] = (catCount[c] || 0) + 1; });
      const domCat = Object.keys(catCount).sort((a, b) => catCount[b] - catCount[a])[0];
      // häufigster Ortsname als Titel
      const placeCount = {};
      lists.forEach(l => { const p = l[0].place; if (p) placeCount[p] = (placeCount[p] || 0) + 1; });
      const placeLabel = Object.keys(placeCount).sort((a, b) => placeCount[b] - placeCount[a])[0] || 'Veranstaltungsort';

      const icon = L.divIcon({
        className: '', iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div style="width:30px;height:30px;border-radius:50%;background:#fcfcfb;' +
              'border:2px solid ' + CATS[domCat].color + ';' +
              'box-shadow:0 1px 4px rgba(11,11,11,.25);display:flex;align-items:center;justify-content:center;' +
              'font-size:12.5px;font-weight:700;color:#0b0b0b;line-height:1">' + lists.length + '</div>'
      });

      const tipRows = lists.slice(0, 6).map(l => {
        const e = l[0];
        return '<tr><td>' + fmtDate(e.start) + '</td><td>' + CATS[catOf(e)].emoji + ' ' +
               esc(e.title.length > 44 ? e.title.slice(0, 43) + '…' : e.title) + '</td></tr>';
      }).join('');
      const tip = '<div class="tip-head">' + esc(placeLabel) + '</div>' +
        '<div class="tip-sub">' + lists.length + ' Veranstaltungen an diesem Ort</div>' +
        '<table>' + tipRows +
        (lists.length > 6 ? '<tr><td></td><td><i>+ ' + (lists.length - 6) + ' weitere</i></td></tr>' : '') +
        '</table>' +
        '<div class="tip-flag">Klicken f&uuml;r Liste mit Links</div>';

      const popup = '<b>' + esc(placeLabel) + '</b><br>' +
        lists.slice(0, 12).map(l => {
          const e = l[0];
          return fmtDate(e.start) + ' — <a href="' + esc(e.url) + '" target="_blank" rel="noopener">' +
                 esc(e.title.length > 60 ? e.title.slice(0, 59) + '…' : e.title) + '</a>';
        }).join('<br>') +
        (lists.length > 12 ? '<br><i>+ ' + (lists.length - 12) + ' weitere — Listenansicht nutzen</i>' : '');

      L.marker([first.lat, first.lon], { icon: icon })
        .bindTooltip(tip, { className: 'evt-tip', sticky: true, direction: 'top', offset: [0, -14] })
        .bindPopup(popup, { maxWidth: 320 })
        .addTo(eventsLayer);
    }

    renderScope();
    renderLegend();
    renderInfo();
    if (listOpen) renderList();
  }

  function renderLegend() {
    if (!legendDiv) return;
    legendDiv.innerHTML = '<button class="mob-toggle" aria-label="Kategorien ein-/ausblenden" title="Kategorien">☰</button>' +
      '<h1>Kategorien (' + rangeLabel(rangeKey) + ')</h1>' +
      Object.keys(CATS).map(c =>
        '<div class="row' + (activeCats[c] ? '' : ' off') + '" data-cat="' + c + '">' +
        '<span class="dot" style="background:' + CATS[c].color + '"></span>' +
        '<span class="label">' + CATS[c].emoji + ' ' + CATS[c].label + ' (' + counts[c] + ')</span></div>'
      ).join('') +
      '<div class="size-hint">Klick auf eine Kategorie blendet sie ein/aus.<br>' +
      'Marker mit Zahl = mehrere Veranstaltungen<br>am selben Ort (Klick zeigt die Liste).</div>';
  }

  function toggleCat(c) {
    activeCats[c] = !activeCats[c];
    localStorage.setItem('eventmap.cats', JSON.stringify(activeCats));
    rebuild();
  }

  function renderInfo() {
    if (!infoDiv) return;
    infoDiv.innerHTML =
      '<h1>Events — Freiburg &amp; Umgebung</h1>' +
      '<div class="meta">Stadtfeste, Partys, Konzerte, M&auml;rkte &amp; mehr im Umkreis von ca. 50 km — ' +
      'aus offenen Quellen (toubiz/Open Data BW, FWTM, Rausgegangen, szene-Radar, Alemannische Seiten, Heuboden).</div>' +
      '<div class="meta" style="margin-top:6px">' +
      '<b>' + shownGroups + '</b> Veranstaltungen sichtbar (' + shownDates + ' Termine im Zeitraum ' + rangeLabel(rangeKey) + ')' +
      '<br>Umkreis: <b>' + radiusLabel() + '</b> um <b>' + esc(center.label) + '</b>' +
      '<br>Datenstand: <b>' + esc(data.generated) + '</b></div>';
  }

  // ---- Bedienelemente Karte ----------------------------------------------
  const info = L.control({ position: 'topleft' });
  info.onAdd = function () {
    infoDiv = L.DomUtil.create('div', 'panel info-panel');
    L.DomEvent.disableClickPropagation(infoDiv);
    // Mobil: initial eingeklappt; Tipp auf die Überschrift klappt auf/zu (Wirkung nur < 640px, s. CSS)
    if (window.matchMedia && window.matchMedia('(max-width: 640px)').matches) infoDiv.classList.add('collapsed');
    infoDiv.addEventListener('click', function (e) {
      if (e.target.closest('h1')) infoDiv.classList.toggle('collapsed');
    });
    renderInfo();
    return infoDiv;
  };
  info.addTo(map);

  // Auf Mobile: Panel per Icon ein-/ausklappen; beim Öffnen alle anderen
  // einklappbaren Panels schließen, damit die Karte frei bleibt
  const isMobile = () => window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
  function toggleCollapse(div) {
    const wasOpen = !div.classList.contains('collapsed');
    if (wasOpen) { div.classList.add('collapsed'); return; }
    document.querySelectorAll('.mob-collapsible, .info-panel').forEach(p => p.classList.add('collapsed'));
    div.classList.remove('collapsed');
  }

  const rangeCtl = L.control({ position: 'topleft' });
  rangeCtl.onAdd = function () {
    const div = L.DomUtil.create('div', 'panel range-ctl mob-collapsible');
    L.DomEvent.disableClickPropagation(div);
    if (isMobile()) div.classList.add('collapsed');
    div.innerHTML = '<button class="mob-toggle" aria-label="Zeitraum-Filter ein-/ausblenden" title="Zeitraum">🕒</button>' +
      '<span class="lbl">Zeitraum</span>' + RANGES.map(r =>
      '<button class="range-btn' + (r.key === rangeKey ? ' active' : '') + '" data-key="' + r.key + '">' + r.label + '</button>'
    ).join('');
    div.addEventListener('click', e => {
      if (e.target.closest('.mob-toggle')) { toggleCollapse(div); return; }
      const btn = e.target.closest('.range-btn');
      if (!btn) return;
      setRange(btn.dataset.key);
    });
    return div;
  };
  rangeCtl.addTo(map);

  function setRange(key) {
    rangeKey = key;
    localStorage.setItem('eventmap.range', rangeKey);
    document.querySelectorAll('.range-btn[data-key]').forEach(b => b.classList.toggle('active', b.dataset.key === rangeKey));
    document.querySelectorAll('#lv-range .chip').forEach(b => b.classList.toggle('active', b.dataset.key === rangeKey));
    rebuild();
  }

  // Umkreis-Steuerung: Radius-Presets + Zentrum per PLZ (Standard: Waldkirch)
  const scopeCtl = L.control({ position: 'topleft' });
  scopeCtl.onAdd = function () {
    const div = L.DomUtil.create('div', 'panel range-ctl scope-ctl mob-collapsible');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    if (isMobile()) div.classList.add('collapsed');
    div.innerHTML = '<button class="mob-toggle" aria-label="Umkreis-Filter ein-/ausblenden" title="Umkreis">📍</button>' +
      '<span class="lbl">Umkreis</span>' +
      RADII.map(r =>
        '<button class="range-btn scope-r' + (r === radiusKm ? ' active' : '') + '" data-km="' + r + '">' +
        (r ? r + ' km' : 'Alle') + '</button>'
      ).join('') +
      '<span class="center-lbl" id="center-lbl">📍 ' + esc(center.label) + '</span>' +
      '<input id="plz-in" inputmode="numeric" maxlength="5" placeholder="PLZ">' +
      '<button class="range-btn" id="plz-go">Setzen</button>' +
      '<button class="range-btn" id="plz-reset" title="Zur&uuml;ck zu Waldkirch">&#8634;</button>' +
      '<span class="hint" id="plz-hint"></span>';
    div.addEventListener('click', e => {
      const btn = e.target.closest('.scope-r');
      if (btn) { setRadius(+btn.dataset.km); return; }
      if (e.target.id === 'plz-go') setCenterFromPlz(div.querySelector('#plz-in').value.trim(), div.querySelector('#plz-hint'));
      if (e.target.id === 'plz-reset') {
        div.querySelector('#plz-in').value = '';
        div.querySelector('#plz-hint').textContent = '';
        setCenter(DEFAULT_CENTER);
      }
    });
    div.querySelector('#plz-in').addEventListener('keydown', e => {
      if (e.key === 'Enter') setCenterFromPlz(e.target.value.trim(), div.querySelector('#plz-hint'));
    });
    return div;
  };
  scopeCtl.addTo(map);

  function updateScopeUIs() {
    document.querySelectorAll('.scope-r').forEach(b => b.classList.toggle('active', +b.dataset.km === radiusKm));
    document.querySelectorAll('#lv-radius-group .chip').forEach(b => b.classList.toggle('active', +b.dataset.km === radiusKm));
    const cl = document.getElementById('center-lbl');
    if (cl) cl.textContent = '📍 ' + center.label;
    const ll = document.getElementById('lv-radius-lbl');
    if (ll) ll.textContent = 'Umkreis um ' + center.label;
  }

  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = function () {
    legendDiv = L.DomUtil.create('div', 'panel legend mob-collapsible');
    L.DomEvent.disableClickPropagation(legendDiv);
    if (isMobile()) legendDiv.classList.add('collapsed');
    legendDiv.addEventListener('click', e => {
      if (e.target.closest('.mob-toggle')) { toggleCollapse(legendDiv); return; }
      const row = e.target.closest('.row[data-cat]');
      if (row) toggleCat(row.dataset.cat);
    });
    renderLegend();
    return legendDiv;
  };
  legend.addTo(map);

  // ---- Listenansicht ------------------------------------------------------
  let listOpen = false;
  let lvSearch = '', lvDays = new Set(), lvSource = '';
  let lvSort = { col: 'start', dir: 1 };
  const LV_MAX = 500;

  const COLS = [
    { key: 'start',  label: 'Datum' },
    { key: 'title',  label: 'Titel' },
    { key: 'place',  label: 'Ort' },
    { key: 'cat',    label: 'Kategorie' },
    { key: 'source', label: 'Quelle' },
    { key: 'dist',   label: 'km' }
  ];
  const DAY_LABELS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function lvFiltered() {
    const q = lvSearch.trim().toLowerCase();
    return inRangeEvents().filter(e => {
      const cat = catOf(e);
      if (!activeCats[cat]) return false;
      if (q && !((e.title || '').toLowerCase().includes(q) || (e.place || '').toLowerCase().includes(q))) return false;
      if (lvDays.size) {
        const d = parseLocal(e.start);
        if (!d || !lvDays.has(d.getDay())) return false;
      }
      if (lvSource && e.source !== lvSource) return false;
      return true;
    });
  }

  function renderList() {
    // Kopfzeile
    document.getElementById('lv-head').innerHTML = COLS.map(c =>
      '<th data-col="' + c.key + '">' + c.label +
      (lvSort.col === c.key ? ' <span class="arr">' + (lvSort.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>'
    ).join('');

    const rows = lvFiltered();
    const val = (e, col) =>
      col === 'dist' ? distKm(e.lat, e.lon) :
      col === 'cat' ? catOf(e) :
      (e[col] || '');
    rows.sort((a, b) => {
      const x = val(a, lvSort.col), y = val(b, lvSort.col);
      if (x < y) return -lvSort.dir;
      if (x > y) return lvSort.dir;
      return a.start < b.start ? -1 : 1;
    });

    const shown = rows.slice(0, LV_MAX);
    document.getElementById('lv-body').innerHTML = shown.map(e => {
      const cat = catOf(e);
      return '<tr>' +
        '<td>' + fmtDate(e.start) + (e.end && e.end.slice(0, 10) !== e.start.slice(0, 10) ? '<br>– ' + fmtDate(e.end) : '') + '</td>' +
        '<td class="t-title"><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a></td>' +
        '<td class="t-place">' + esc(e.place || '–') + '</td>' +
        '<td>' + CATS[cat].emoji + ' ' + CATS[cat].label + '</td>' +
        '<td>' + esc(e.source) + '</td>' +
        '<td>' + distKm(e.lat, e.lon).toFixed(0) + '</td>' +
        '</tr>';
    }).join('');

    const more = document.getElementById('lv-more');
    if (rows.length > LV_MAX) {
      more.style.display = '';
      more.textContent = 'Weitere ' + (rows.length - LV_MAX) + ' Termine — Filter verfeinern, um sie zu sehen.';
    } else {
      more.style.display = 'none';
    }

    document.getElementById('lv-count').innerHTML = '<b>' + rows.length + '</b> Termine';
    // Kategorie-Chips synchron zur Legende
    document.querySelectorAll('#lv-cats .chip').forEach(b => b.classList.toggle('active', !!activeCats[b.dataset.cat]));
  }

  function initListControls() {
    // Zeitraum-Chips
    const rangeSpan = document.getElementById('lv-range');
    RANGES.forEach(r => {
      const b = document.createElement('button');
      b.className = 'chip' + (r.key === rangeKey ? ' active' : '');
      b.dataset.key = r.key;
      b.textContent = r.label;
      b.addEventListener('click', () => setRange(r.key));
      rangeSpan.appendChild(b);
    });
    // Kategorie-Chips
    const catSpan = document.getElementById('lv-cats');
    Object.keys(CATS).forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (activeCats[c] ? ' active' : '');
      b.dataset.cat = c;
      b.textContent = CATS[c].emoji + ' ' + CATS[c].label;
      b.addEventListener('click', () => toggleCat(c));
      catSpan.appendChild(b);
    });
    // Wochentag-Chips (Mo–So)
    const daySpan = document.getElementById('lv-days');
    [1, 2, 3, 4, 5, 6, 0].forEach(d => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = DAY_LABELS[d];
      b.addEventListener('click', () => {
        if (lvDays.has(d)) { lvDays.delete(d); b.classList.remove('active'); }
        else { lvDays.add(d); b.classList.add('active'); }
        renderList();
      });
      daySpan.appendChild(b);
    });
    // Suche
    document.getElementById('lv-search').addEventListener('input', e => {
      lvSearch = e.target.value; renderList();
    });
    // Umkreis-Chips (synchron zur Karten-Steuerung)
    const radSpan = document.getElementById('lv-radius-group');
    RADII.forEach(r => {
      const b = document.createElement('button');
      b.className = 'chip' + (r === radiusKm ? ' active' : '');
      b.dataset.km = r;
      b.textContent = r ? r + ' km' : 'alle';
      b.addEventListener('click', () => setRadius(r));
      radSpan.appendChild(b);
    });
    // Quelle
    const srcSel = document.getElementById('lv-source');
    [...new Set(data.events.map(e => e.source))].sort().forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      srcSel.appendChild(o);
    });
    srcSel.addEventListener('change', e => { lvSource = e.target.value; renderList(); });
    // Sortierung
    document.getElementById('lv-head').addEventListener('click', e => {
      const th = e.target.closest('th[data-col]');
      if (!th) return;
      const col = th.dataset.col;
      if (lvSort.col === col) lvSort.dir = -lvSort.dir;
      else lvSort = { col: col, dir: 1 };
      renderList();
    });
  }

  // Umschalter Karte/Liste
  const btnMap = document.getElementById('btn-map');
  const btnList = document.getElementById('btn-list');
  function setView(list) {
    listOpen = list;
    document.getElementById('listview').classList.toggle('open', list);
    btnMap.classList.toggle('active', !list);
    btnList.classList.toggle('active', list);
    if (list) renderList();
  }
  btnMap.addEventListener('click', () => setView(false));
  btnList.addEventListener('click', () => setView(true));

  initListControls();
  updateScopeUIs();
  fitToScope();
  rebuild();

  // Seite stündlich neu laden (der Scheduler aktualisiert die Datendatei;
  // Zeitraum & Kategorien bleiben via localStorage erhalten)
  setTimeout(function () { location.reload(); }, 60 * 60 * 1000);
})();
</script>
</body>
</html>
