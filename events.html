<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventkarte Freiburg &amp; Umgebung</title>
<meta property="og:image" content="https://map.aleduwa.de/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://map.aleduwa.de/og-image.png">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  :root {
    --ink:        #171614;
    --ink-2:      #56544f;
    --muted:      #8b8880;
    --surface:    #fcfcfb;
    --panel:      rgba(252,252,251,0.88);   /* Panels liegen auf der Karte */
    --panel-solid:#fcfcfb;
    --hairline:   rgba(11,11,11,0.09);
    --track:      #edebe6;
    --hover:      rgba(11,11,11,0.05);
    --accent:     #8f1d1d;
    --accent-bg:  rgba(143,29,29,0.10);
    --shadow:     0 6px 24px rgba(11,11,11,0.10), 0 1px 3px rgba(11,11,11,0.07);
    --shadow-lg:  0 12px 40px rgba(11,11,11,0.18);
  }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--surface);
    height: 100dvh; overflow: hidden; }
  /* Ausserhalb der Kugel ist der Canvas transparent — der Container liefert
     den "Weltraum" hinter dem Globus. */
  #map { height: 100%; background: #0d1524; }

  /* Touch: kein Tap-Blitzen, kein Doppeltipp-Zoom auf Bedienelementen */
  .mode-switch a, .view-switch button, .range-btn, .chip, .legend .row,
  .lv-table th, .lv-filters select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  .panel {
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    backdrop-filter: blur(14px) saturate(1.4);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.45;
    max-width: 290px;
  }
  .panel h1 { font-size: 13.5px; margin: 0 0 5px; font-weight: 650; letter-spacing: -0.01em; }
  .panel .meta { color: var(--ink-2); font-size: 12px; }
  .panel .meta b { color: var(--ink); font-weight: 600; }

  .range-ctl { display: flex; gap: 4px; padding: 6px; flex-wrap: wrap; }
  .range-ctl .lbl { font-size: 11.5px; color: var(--ink-2); align-self: center; padding: 0 4px 0 2px; }
  .scope-ctl input {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 6px; font-size: 12px;
    font-family: inherit; background: var(--surface); color: var(--ink); width: 52px;
  }
  .scope-ctl .center-lbl { font-size: 11.5px; color: var(--ink-2); align-self: center; padding: 0 2px; max-width: 130px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scope-ctl .hint { flex-basis: 100%; font-size: 11px; color: #d03b3b; padding: 2px 2px 0; }
  .range-btn {
    border: 1px solid var(--hairline); background: var(--panel-solid); color: var(--ink-2);
    border-radius: 9px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: background .15s, color .15s;
  }
  .range-btn:hover { background: var(--hover); color: var(--ink); }
  .range-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .legend .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; user-select: none; }
  .legend .row:hover .label { color: var(--ink); }
  .legend .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--hairline); flex: none; }
  .legend .label { color: var(--ink-2); font-size: 12px; }
  .legend .row.off { opacity: 0.45; }
  .legend .row.off .label { text-decoration: line-through; }
  .legend .row.off .dot { background: transparent !important; box-shadow: inset 0 0 0 2px var(--muted); border-color: transparent; }
  .legend .size-hint { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hairline); color: var(--muted); font-size: 11.5px; }

  .evt-tip {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(11,11,11,0.18);
    padding: 8px 10px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink);
    /* width:max-content verhindert das "Hochkant"-Schrumpfen absolut
       positionierter Tooltips: erst die natürliche Zeilenbreite nehmen,
       dann bei max-width umbrechen */
    width: max-content;
    max-width: min(340px, 82vw);
    white-space: normal;
  }
  .evt-tip .tip-head { font-weight: 650; margin-bottom: 2px; max-width: 320px; }
  .evt-tip .tip-sub { color: var(--ink-2); }
  .evt-tip .tip-flag { color: var(--muted); font-style: italic; margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .evt-tip table { border-collapse: collapse; margin-top: 4px; }
  .evt-tip td { padding: 0 0 1px; color: var(--ink); vertical-align: top; }
  .evt-tip td:first-child { color: var(--ink-2); padding-right: 10px; white-space: nowrap; }

  .maplibregl-ctrl-attrib {
    font-size: 10px; border-radius: 8px 0 0 0;
    background: var(--panel) !important;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib a { color: var(--ink-2); }
  .maplibregl-ctrl-group {
    background: var(--panel) !important; border: 1px solid var(--hairline);
    border-radius: 12px !important; box-shadow: var(--shadow) !important; overflow: hidden;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hairline); }

  /* Hover-Tooltip: freies DIV ueber der Karte (MapLibre hat kein Tooltip-Konzept) */
  #hovertip {
    position: absolute; z-index: 1102; pointer-events: none; display: none;
    max-width: 340px; transform: translate(-50%, -100%); margin-top: -14px;
  }
  .maplibregl-popup.evt-popup .maplibregl-popup-content {
    background: var(--panel-solid); border: 1px solid var(--hairline);
    border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px;
    font-size: 12.5px; line-height: 1.5; color: var(--ink);
  }
  .maplibregl-popup.evt-popup .maplibregl-popup-tip {
    border-top-color: var(--panel-solid); border-bottom-color: var(--panel-solid);
  }
  .maplibregl-popup.evt-popup .maplibregl-popup-close-button {
    font-size: 18px; color: var(--ink-2); padding: 2px 7px; border-radius: 8px;
  }
  .maplibregl-popup.evt-popup a { color: var(--accent); }
  .mk { cursor: pointer; }

  .nowebgl {
    max-width: 480px; margin: 0 auto; padding: 18vh 24px 24px;
    font-size: 15px; line-height: 1.6; color: var(--ink); text-align: center;
  }
  .nowebgl h1 { font-size: 20px; margin: 0 0 10px; }
  .nowebgl a { color: var(--accent); }


  /* Alt-Bestand: die Panels klappten früher per Icon ein. Seit die Mobil-
     Bedienung über Leiste + Sheet läuft, werden diese Knöpfe nicht mehr
     gebraucht — die Markup-Stellen bleiben, der Knopf verschwindet. */
  .mob-toggle { display: none; }

  .mode-switch, .view-switch {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); z-index: 1101;
    display: flex; gap: 2px; padding: 3px;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 13px;
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  }
  .mode-switch { left: 50%; transform: translateX(-50%); }
  .view-switch { right: 10px; }
  .mode-switch a, .view-switch button {
    padding: 7px 15px; font-size: 13px; text-decoration: none; color: var(--ink-2);
    border: 0; background: transparent; cursor: pointer; font-family: inherit;
    border-radius: 10px; transition: background .15s, color .15s;
  }
  .mode-switch a.active, .view-switch button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .mode-switch a:not(.active):hover, .view-switch button:not(.active):hover { background: var(--hover); color: var(--ink); }

  /* Listenansicht */
  #listview { position: absolute; inset: 52px 10px 10px 10px; z-index: 1100; display: none;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: 0 1px 6px rgba(11,11,11,0.15); overflow: hidden; flex-direction: column; }
  #listview.open { display: flex; }
  .lv-filters { padding: 10px 12px; border-bottom: 1px solid var(--hairline);
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12.5px; }
  .lv-filters .group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .lv-filters .glbl { color: var(--ink-2); font-size: 11.5px; margin-right: 2px; }
  .chip {
    border: 1px solid var(--hairline); background: var(--panel-solid); color: var(--ink-2);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; font-family: inherit;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { background: var(--hover); color: var(--ink); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .lv-filters input[type="search"] {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 8px; font-size: 12.5px;
    font-family: inherit; background: var(--surface); color: var(--ink); width: 170px;
  }
  .lv-filters select {
    border: 1px solid var(--hairline); border-radius: 6px; padding: 3px 6px; font-size: 12.5px;
    font-family: inherit; background: var(--surface); color: var(--ink-2);
  }
  .lv-filters input[type="range"] { width: 110px; accent-color: #8f1d1d; vertical-align: middle; }
  .lv-count { color: var(--ink-2); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .lv-count b { color: var(--ink); }

  .lv-tablewrap { overflow: auto; flex: 1; }
  .lv-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .lv-table th, .lv-table td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  .lv-table td.t-title { white-space: normal; min-width: 180px; max-width: 420px; }
  .lv-table td.t-place { white-space: normal; max-width: 220px; color: var(--ink-2); }
  .lv-table th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2);
    font-weight: 600; font-size: 11.5px; cursor: pointer; user-select: none; z-index: 1;
    border-bottom: 2px solid var(--hairline); }
  .lv-table th:hover { color: var(--ink); }
  .lv-table th .arr { font-size: 9px; }
  .lv-table a { color: #8f1d1d; text-decoration: none; }
  .lv-table a:hover { text-decoration: underline; }
  .lv-table tr:hover td { background: #f7f6f3; }
  .lv-more { padding: 10px 12px; color: var(--muted); font-size: 12px; text-align: center; }

  /* "läuft gerade" — der einzige grüne Akzent auf der Seite, damit er sticht */
  .live-badge {
    display: inline-block; margin-left: 7px; padding: 1px 7px 2px; border-radius: 999px;
    background: #e7f4ec; color: #1c6b3f; border: 1px solid #a8d7bd;
    font-size: 10.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
    vertical-align: middle;
  }
  .live-badge::before {
    content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #22a05b; margin-right: 5px; vertical-align: middle;
    animation: livepulse 1.8s ease-in-out infinite;
  }
  @keyframes livepulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live-badge::before { animation: none; } }

  /* Info-Panel: auf Desktop immer offen; Einklapp-Verhalten nur mobil (s. Media Query) */
  .info-panel h1 { cursor: default; }

  /* Eingeklapptes Menue unten links (Nachbau des frueheren Layer-Controls) */
  .layer-ctl { padding: 0; max-width: 300px; overflow: hidden; }
  .layer-ctl .lc-toggle {
    width: 42px; height: 42px; border: 0; background: transparent; padding: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; color: var(--ink-2); font-family: inherit;
  }
  .layer-ctl .lc-toggle .ic { width: 21px; height: 21px; }
  .layer-ctl .lc-toggle:hover { background: var(--hover); color: var(--ink); }
  .layer-ctl .lc-body { display: none; padding: 10px 12px 12px; }
  .layer-ctl.open .lc-body { display: block; }
  .layer-ctl.open .lc-toggle { display: none; }
  .lc-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 650; color: var(--ink); margin-bottom: 6px;
  }
  .lc-close { border: 0; background: transparent; cursor: pointer; font-size: 15px;
              color: var(--muted); border-radius: 8px; padding: 2px 6px; font-family: inherit; }
  .lc-close:hover { background: var(--hover); color: var(--ink); }

  /* Kartenstil-Auswahl als Bildvorschau (wie auf der Feuerkarte) */
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .style-card {
    position: relative; display: block; padding: 0; margin: 0; cursor: pointer;
    border: 2px solid transparent; border-radius: 11px; overflow: hidden;
    background: var(--track); transition: border-color .15s, transform .12s;
    line-height: 0;
  }
  .style-card:hover { transform: translateY(-1px); }
  .style-card input { position: absolute; opacity: 0; pointer-events: none; }
  .style-card img { display: block; width: 100%; height: 64px; object-fit: cover; }
  .style-card .style-name {
    display: block; padding: 5px 8px 6px; font-size: 11.5px; font-weight: 600;
    line-height: 1.3; color: var(--ink-2); background: var(--panel-solid);
  }
  .style-card.active { border-color: var(--accent); }
  .style-card.active .style-name { color: var(--accent); }
  .style-card.active::after {
    content: '¹3'; position: absolute; top: 5px; right: 6px;
    width: 19px; height: 19px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 12px; line-height: 19px; text-align: center; font-weight: 700;
  }
  .pane-links {
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--hairline);
    font-size: 11.5px; color: var(--muted);
  }
  .pane-links a { color: var(--ink-2); text-decoration: none; }
  .pane-links a:hover { color: var(--accent); text-decoration: underline; }
  .lc-title { font-size: 10.5px; color: var(--muted); text-transform: uppercase;
              letter-spacing: .05em; margin: 10px 0 3px; font-weight: 600; }
  .lc-title:first-child { margin-top: 0; }

  /* ---- Mobile Bedienung: Leiste unten + Sheet --------------------------- */
  /* Vorher lagen mehrere Icon-Kacheln frei auf der Karte und überlagerten
     sich mit der Attributionszeile. Jetzt: eine Leiste, ein Sheet. */
  #mbar, #sheet, #scrim, .lv-mobilebar { display: none; }

  @media (max-width: 640px) {
    .mode-switch a, .view-switch button { padding: 9px 12px; font-size: 12.5px; }

    /* Karten-Panels und Leaflet-Menüs wandern ins Sheet */
    .maplibregl-ctrl.panel { display: none; }
    .maplibregl-ctrl-group.nav-ctl { display: none; }   /* Zoom: Pinch reicht */
    .maplibregl-ctrl-top-left { top: calc(52px + env(safe-area-inset-top)); }
    .maplibregl-ctrl-top-right { top: calc(52px + env(safe-area-inset-top)); }
    .maplibregl-ctrl-bottom-right { bottom: calc(70px + env(safe-area-inset-bottom)); }
    .maplibregl-ctrl-bottom-left  { bottom: calc(70px + env(safe-area-inset-bottom)); }

    /* Standort-Button schwebend ueber der Leiste, ueber der Attributionszeile */
    .geo-ctl {
      position: fixed !important; right: 12px;
      bottom: calc(112px + env(safe-area-inset-bottom)); margin: 0 !important;
      border-radius: 50% !important;
    }
    .geo-ctl button { width: 46px !important; height: 46px !important; }

    #mbar {
      display: flex; position: fixed; z-index: 1102; left: 50%; transform: translateX(-50%);
      bottom: calc(10px + env(safe-area-inset-bottom));
      gap: 2px; padding: 4px; border-radius: 17px;
      background: var(--panel); border: 1px solid var(--hairline); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    }
    #mbar button {
      min-width: 56px; min-height: 48px; border: 0; background: transparent;
      border-radius: 13px; color: var(--ink-2); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 10px; line-height: 1; padding: 0 3px; font-family: inherit;
    }
    #mbar button .ic { width: 20px; height: 20px; }
    #mbar button.active { background: var(--accent-bg); color: var(--accent); font-weight: 650; }
    body.list-open #mbar, body.list-open .geo-ctl { display: none; }  /* Liste hat eigene Leiste */

    #scrim {
      display: block; position: fixed; inset: 0; z-index: 1103; background: rgba(11,11,11,.35);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #scrim.open { opacity: 1; pointer-events: auto; }

    #sheet {
      display: flex; flex-direction: column; position: fixed; z-index: 1104;
      left: 0; right: 0; bottom: 0; max-height: 78dvh;
      background: var(--panel-solid); color: var(--ink);
      border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg);
      transform: translateY(101%); transition: transform .3s cubic-bezier(.32,.72,0,1);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #sheet.open { transform: none; }
    .sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--hairline);
                  margin: 8px auto 2px; flex: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between;
                  padding: 6px 16px 8px; flex: none; }
    .sheet-head b { font-size: 15px; letter-spacing: -0.01em; }
    .sheet-close { border: 0; background: var(--track); color: var(--ink-2); cursor: pointer;
                   width: 30px; height: 30px; border-radius: 50%; font-size: 15px; font-family: inherit; }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 18px; font-size: 14px; }
    .sheet-body .panel { display: block !important; background: transparent; border: 0; box-shadow: none;
                         padding: 0; max-width: none; backdrop-filter: none; }
    .sheet-body .panel h1 { display: none; }        /* Titel steht im Sheet-Kopf */
    .sheet-body .range-btn { padding: 10px 14px; font-size: 14px; border-radius: 11px; }
    .sheet-body .range-ctl { flex-wrap: wrap; gap: 7px; padding: 0; }
    .sheet-body .legend .row { padding: 9px 0; margin: 0; }
    .sheet-body .legend .label { font-size: 14px; }
    .sheet-body .legend { max-width: none; max-height: none; }
    .sheet-body .scope-ctl input { font-size: 16px; padding: 9px 12px; width: 88px; border-radius: 10px; }
    .sheet-body .style-grid { gap: 10px; }
    .sheet-body .style-card img { height: 78px; }
    .sheet-body .legend .row { padding: 11px 0; }

    /* ---- Listenansicht: Karten statt Tabelle --------------------------- */
    #listview { inset: calc(48px + env(safe-area-inset-top)) 0 0 0; border-radius: 0; border: 0;
                border-top: 1px solid var(--hairline); }
    /* Der Filterblock liegt normalerweise ausgeblendet in der Liste und wird
       beim Antippen von "Filter" ins Sheet gehängt — dort untereinander,
       mit Tippflächen statt Maus-Zielen. */
    .lv-filters { display: none; }
    .sheet-body .lv-filters {
      display: flex; flex-direction: column; align-items: stretch; gap: 16px;
      padding: 0; border: 0; overflow: visible; font-size: 14px;
    }
    /* Beschriftung auf eigener Zeile, die Chips darunter umbrechend —
       nicht untereinander gestapelt, sonst wird das Sheet endlos lang. */
    .sheet-body .lv-filters .group { flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: center; flex: none; }
    .sheet-body .lv-filters .glbl {
      flex-basis: 100%; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); font-weight: 600; margin: 0;
    }
    .sheet-body .lv-filters .group > :not(.glbl) { flex: none; }
    .sheet-body .lv-filters .chip { padding: 9px 14px; font-size: 14px; min-height: 40px; }
    .sheet-body .lv-filters input[type="search"],
    .sheet-body .lv-filters select {
      width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 11px;   /* 16px: verhindert iOS-Zoom */
      border: 1px solid var(--hairline); background: var(--panel-solid); color: var(--ink);
      font-family: inherit;
    }
    .sheet-body .lv-filters input[type="range"] { width: 100%; height: 32px; }
    .sheet-body .lv-count { display: none; }         /* Trefferzahl steht in der Leiste */
    .lv-mobilebar {
      display: flex; align-items: center; gap: 8px; padding: 9px 10px; flex: none;
      border-bottom: 1px solid var(--hairline); background: var(--panel-solid);
    }
    .lv-mobilebar .fbtn {
      display: flex; align-items: center; gap: 7px; border: 1px solid var(--hairline);
      background: var(--panel-solid); color: var(--ink); border-radius: 999px;
      padding: 0 15px; height: 40px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .lv-mobilebar .fbtn .ic { width: 17px; height: 17px; }
    .lv-mobilebar .fbtn.has { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lv-mobilebar select {
      border: 1px solid var(--hairline); border-radius: 999px; padding: 0 8px; height: 40px;
      font-size: 13.5px; background: var(--panel-solid); color: var(--ink-2); font-family: inherit;
      max-width: 42vw;
    }
    .lv-mobilebar .cnt { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
    .lv-mobilebar .cnt b { color: var(--ink); }

    .lv-tablewrap { -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
                    padding: 10px 0 20px; background: #f5f4f1; }
    .lv-table { display: block; width: auto; font-size: 13px; }
    .lv-table thead { display: none; }              /* sortiert wird über die Leiste */
    .lv-table tbody, .lv-table tr, .lv-table td { display: block; width: auto; }
    .lv-table tr {
      background: var(--panel-solid); border: 1px solid var(--hairline); border-radius: 14px;
      box-shadow: 0 1px 3px rgba(11,11,11,.05); padding: 12px 14px; margin: 0 10px 10px;
    }
    .lv-table tr:hover td { background: transparent; }
    .lv-table td { border: 0; padding: 0; white-space: normal; max-width: none; }
    .lv-table td[data-col="start"] { font-size: 12px; font-weight: 650; color: var(--accent); }
    .lv-table td[data-col="title"] { font-size: 15px; line-height: 1.3; margin: 4px 0 3px; min-width: 0; }
    .lv-table td[data-col="title"] a { color: var(--ink); font-weight: 600; }
    .lv-table td[data-col="place"] { font-size: 13px; color: var(--ink-2); }
    .lv-table td[data-col="cat"], .lv-table td[data-col="source"], .lv-table td[data-col="dist"] {
      display: inline-block; font-size: 11.5px; color: var(--muted); margin: 7px 10px 0 0;
    }
    .lv-table td[data-col="dist"]::after { content: " km"; }
    .lv-more { margin: 0 10px; }
  }

  /* Sehr schmal: Umschalter nur mit Emoji, damit Mitte und rechts nicht kollidieren */
  @media (max-width: 560px) {
    .mode-switch .sw-txt { display: none; }
    .mode-switch a { padding: 9px 12px; }
  }
  @media (max-width: 400px) {
    .view-switch .sw-txt { display: none; }
    .view-switch button { padding: 9px 12px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="hovertip" class="evt-tip"></div>
<div class="mode-switch"><a href="index.html" aria-label="Feuerkarte">🔥<span class="sw-txt"> Feuerkarte</span></a><a href="events.html" class="active" aria-label="Eventkarte">🎉<span class="sw-txt"> Eventkarte</span></a></div>
<div class="view-switch"><button id="btn-map" class="active" aria-label="Karte">🗺️<span class="sw-txt"> Karte</span></button><button id="btn-list" aria-label="Liste">📋<span class="sw-txt"> Liste</span></button></div>

<div id="listview">
  <div class="lv-filters">
    <span class="group" id="lv-range"><span class="glbl">Zeitraum</span></span>
    <span class="group" id="lv-cats"><span class="glbl">Kategorie</span></span>
    <span class="group"><span class="glbl">Suche</span><input type="search" id="lv-search" placeholder="Titel oder Ort …"></span>
    <span class="group" id="lv-radius-group"><span class="glbl" id="lv-radius-lbl">Umkreis</span></span>
    <span class="group" id="lv-days"><span class="glbl">Tag</span></span>
    <span class="group"><span class="glbl">Quelle</span><select id="lv-source"><option value="">alle</option></select></span>
    <span class="lv-count" id="lv-count"></span>
  </div>
  <div class="lv-tablewrap">
    <table class="lv-table">
      <thead><tr id="lv-head"></tr></thead>
      <tbody id="lv-body"></tbody>
    </table>
    <div class="lv-more" id="lv-more" style="display:none"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
<script src="mapstyle.js"></script>
<script src="data/veranstaltungen.js"></script>
<script>
(function () {
  'use strict';

  // Ohne WebGL kann MapLibre nicht rendern -> klassische Rasterkarte anbieten
  try {
    const probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('kein WebGL');
  } catch (e) {
    // Nicht auf klassisch.html umleiten — das ist die FEUERkarte. Hier lieber
    // ehrlich sagen, was los ist, statt die falsche Karte zu zeigen.
    document.getElementById('map').innerHTML =
      '<div class="nowebgl">' +
      '<h1>Diese Karte braucht WebGL</h1>' +
      '<p>Dein Browser kann keine 3D-Grafik darstellen — meist liegt das an ' +
      'abgeschalteter Hardwarebeschleunigung oder einem sehr alten Gerät.</p>' +
      '<p>Die <a href="klassisch.html">klassische Feuerkarte</a> kommt ohne WebGL aus. ' +
      'Für die Veranstaltungen gibt es derzeit keine Alternative ohne Karte.</p>' +
      '<p><a href="index.html">Feuerkarte</a> · <a href="hinweise.html">Hinweise &amp; Quellen</a> · ' +
      '<a href="impressum.html">Impressum</a></p></div>';
    return;
  }

  const STYLES = window.MAP_STYLES.STYLES;
  const skyFor = window.MAP_STYLES.skyFor;
  const PAL = window.MAP_STYLES.PAL;
  const IS_TOUCH = window.matchMedia && window.matchMedia('(hover: none)').matches;
  const isMobile = () => window.matchMedia && window.matchMedia('(max-width: 640px)').matches;

  let styleChoice = localStorage.getItem('eventmap.style') || 'ruhig';
  if (!STYLES[styleChoice]) styleChoice = 'ruhig';

  // Startausschnitt: Freiburg + 50 km (wird nach dem Laden auf den Umkreis gesetzt)
  const map = new maplibregl.Map({
    container: 'map',
    style: window.MAP_STYLES.resolve(styleChoice),
    bounds: [[7.1, 47.45], [8.6, 48.55]],
    fitBoundsOptions: { padding: isMobile() ? 2 : 20 },
    attributionControl: false,
    maxZoom: 18
  });
  const navCtl = new maplibregl.NavigationControl({ visualizePitch: false });
  map.addControl(navCtl, 'top-right');
  if (navCtl._container) navCtl._container.classList.add('nav-ctl');

  // Standort: Koordinaten bleiben im Browser (siehe Datenschutzerklärung)
  const geoCtl = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true, showUserLocation: true, showAccuracyCircle: true
  });
  map.addControl(geoCtl, 'top-right');
  if (geoCtl._container) geoCtl._container.classList.add('geo-ctl');
  geoCtl.on('error', e => console.warn('Standort nicht verfügbar:', e && e.message));

  const eventAttrib = 'Events: <a href="https://www.tourismus-bw.de/">toubiz/Open Data BW</a>, ' +
      '<a href="https://veranstaltungen.freiburg.de/">FWTM</a>, ' +
      '<a href="https://rausgegangen.de/freiburg/">Rausgegangen</a>, ' +
      '<a href="https://freiburg.szene-radar.de/">szene-Radar</a>, ' +
      '<a href="https://www.alemannische-seiten.de/">Alemannische Seiten</a>, ' +
      '<a href="https://www.heuboden.de/">Heuboden</a>';
  map.addControl(new maplibregl.AttributionControl({
    compact: isMobile(),
    customAttribution: '<a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a> &middot; ' +
      eventAttrib + ' &middot; <a href="impressum.html">Impressum</a> &middot; ' +
      '<a href="datenschutz.html">Datenschutz</a> &middot; <a href="hinweise.html">Hinweise</a>'
  }), 'bottom-right');

  // ---- Daten & Kategorien -------------------------------------------------
  const data = window.EVENT_DATA || { events: [], generated: '–' };

  const CATS = {
    fest:      { emoji: '🎪', label: 'Fest',      color: '#c2410c' },
    party:     { emoji: '🎉', label: 'Party',     color: '#db2777' },
    musik:     { emoji: '🎵', label: 'Musik',     color: '#7c3aed' },
    markt:     { emoji: '🛍️', label: 'Markt',     color: '#b45309' },
    kultur:    { emoji: '🎭', label: 'Kultur',    color: '#0e7490' },
    sport:     { emoji: '⚽', label: 'Sport',     color: '#15803d' },
    sonstiges: { emoji: '📌', label: 'Sonstiges', color: '#898781' }
  };
  const catOf = e => CATS[e.cat] ? e.cat : 'sonstiges';

  // Kategorie-Sichtbarkeit (Legende klickbar); Kultur ist standardmäßig aus
  let activeCats = null;
  try { activeCats = JSON.parse(localStorage.getItem('eventmap.cats')); } catch (e) { }
  if (!activeCats || typeof activeCats !== 'object') activeCats = null;
  if (!activeCats) {
    activeCats = {};
    Object.keys(CATS).forEach(c => activeCats[c] = (c !== 'kultur'));
  }
  Object.keys(CATS).forEach(c => { if (typeof activeCats[c] !== 'boolean') activeCats[c] = (c !== 'kultur'); });

  // start/end kommen als "yyyy-MM-dd" oder "yyyy-MM-ddTHH:mm" (Lokalzeit
  // Europe/Berlin). Wir bauen daraus lokale Date-Objekte aus Komponenten.
  function parseLocal(s) {
    if (!s) return null;
    const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10),
                       s.length > 10 ? +s.slice(11, 13) : 0,
                       s.length > 10 ? +s.slice(14, 16) : 0);
    return isNaN(d) ? null : d;
  }
  const hasTime = s => !!s && s.length > 10;

  // Lizenzkuerzel des Open-Data-Pools lesbar machen. CC BY-SA verlangt
  // Namensnennung und Weitergabe unter gleichen Bedingungen — deshalb steht
  // die Lizenz am einzelnen Termin und nicht nur pauschal im Impressum.
  const LICENSES = {
    'cc-by-sa': { label: 'CC BY-SA', url: 'https://creativecommons.org/licenses/by-sa/4.0/deed.de' },
    'cc-by':    { label: 'CC BY',    url: 'https://creativecommons.org/licenses/by/4.0/deed.de' },
    'cc-0':     { label: 'CC0',      url: 'https://creativecommons.org/publicdomain/zero/1.0/deed.de' },
    'cc-by-nc': { label: 'CC BY-NC', url: 'https://creativecommons.org/licenses/by-nc/4.0/deed.de' }
  };
  function licHtml(e) {
    const l = LICENSES[e.lic];
    if (!l) return '';
    return '<a href="' + l.url + '" target="_blank" rel="noopener license">' + l.label + '</a>';
  }

  // "Läuft gerade": nur für Termine mit echter Uhrzeit sinnvoll. Fehlt die
  // Endzeit (der Normalfall in den Quellen), rechnen wir mit vier Stunden
  // Laufzeit — lieber knapp schätzen als einen längst beendeten Termin als
  // laufend ausweisen. Termine ohne Uhrzeit bleiben außen vor: bei ihnen
  // stünde sonst ab Mitternacht "läuft gerade" am Dorffest.
  function isRunning(e) {
    if (!hasTime(e.start)) return false;
    const s = parseLocal(e.start);
    if (!s) return false;
    const end = hasTime(e.end) ? parseLocal(e.end) : new Date(s.getTime() + 4 * 3600e3);
    const now = new Date();
    return s <= now && now < end;
  }

  function fmtDate(s) {
    const d = parseLocal(s);
    if (!d) return '–';
    let out = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
    if (hasTime(s)) {
      out += ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
    }
    return out;
  }

  // ---- Umkreis: Zentrum (Standard Waldkirch) + Radius ---------------------
  const DEFAULT_CENTER = { lat: 48.0938, lon: 7.9607, label: 'Waldkirch' };
  const RADII = [10, 25, 50, 0];   // 0 = alle
  let center = null;
  try { center = JSON.parse(localStorage.getItem('eventmap.center')); } catch (e) { }
  if (!center || typeof center.lat !== 'number' || typeof center.lon !== 'number' || !center.label) center = DEFAULT_CENTER;
  let radiusKm = +(localStorage.getItem('eventmap.radius') || 25);
  if (!RADII.includes(radiusKm)) radiusKm = 25;

  // Entfernung vom gewählten Zentrum in km
  function distKm(lat, lon) {
    const dLat = (lat - center.lat) * 111;
    const dLon = (lon - center.lon) * 111 * Math.cos(center.lat * Math.PI / 180);
    return Math.sqrt(dLat * dLat + dLon * dLon);
  }

  function radiusLabel() { return radiusKm ? '≤ ' + radiusKm + ' km' : 'alle'; }

  function setRadius(km) {
    radiusKm = km;
    localStorage.setItem('eventmap.radius', String(km));
    updateScopeUIs();
    fitToScope();
    rebuild();
  }

  function setCenter(c) {
    center = c;
    localStorage.setItem('eventmap.center', JSON.stringify(c));
    updateScopeUIs();
    fitToScope();
    rebuild();
  }

  function fitToScope() {
    const pad = isMobile() ? 6 : 24;
    if (radiusKm) {
      // Quadrat um den Mittelpunkt, Kantenlaenge = Durchmesser
      const dLat = radiusKm / 111;
      const dLon = radiusKm / (111 * Math.cos(center.lat * Math.PI / 180));
      map.fitBounds([[center.lon - dLon, center.lat - dLat],
                     [center.lon + dLon, center.lat + dLat]], { padding: pad, duration: 600 });
    } else {
      map.fitBounds([[7.1, 47.45], [8.6, 48.55]], { padding: pad, duration: 600 });
    }
  }

  // PLZ -> Koordinaten (Nominatim, nur auf Nutzeraktion; OSM-Attribution vorhanden)
  function setCenterFromPlz(plz, hintEl) {
    if (!/^\d{5}$/.test(plz)) { if (hintEl) hintEl.textContent = 'Bitte 5-stellige PLZ eingeben.'; return; }
    if (hintEl) hintEl.textContent = 'Suche PLZ ' + plz + ' …';
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&postalcode=' + encodeURIComponent(plz))
      .then(r => r.json())
      .then(res => {
        if (!res.length) { if (hintEl) hintEl.textContent = 'PLZ nicht gefunden.'; return; }
        const lat = +res[0].lat, lon = +res[0].lon;
        if (lat < 47.2 || lat > 48.8 || lon < 6.8 || lon > 8.9) {
          if (hintEl) hintEl.textContent = 'PLZ liegt außerhalb des Kartengebiets.';
          return;
        }
        if (hintEl) hintEl.textContent = '';
        setCenter({ lat: lat, lon: lon, label: 'PLZ ' + plz });
      })
      .catch(() => { if (hintEl) hintEl.textContent = 'PLZ-Suche derzeit nicht erreichbar.'; });
  }

  // ---- Zeitraum-Filter (Zukunft) -----------------------------------------
  const RANGES = [
    // Nach Mitternacht heißt "Heute" faktisch "die laufende Nacht" — das sagt
    // die Beschriftung dann auch, sonst wirkt das Datum daneben wie ein Fehler.
    { key: 'today',
      get label() { return isNightOwlHour() ? 'Heute Nacht' : 'Heute'; },
      get title() {
        return isNightOwlHour()
          ? 'Die laufende Nacht: Der Ausgeh-Tag endet erst um 5 Uhr, deshalb siehst du weiter die Termine von gestern Abend.'
          : 'Heute — inklusive der Nacht bis 5 Uhr morgens.';
      } },
    { key: 'weekend', label: 'Wochenende' },
    { key: '7',       label: '7 T' },
    { key: '30',      label: '30 T' },
    { key: '90',      label: '90 T' }
  ];
  let rangeKey = localStorage.getItem('eventmap.range') || 'weekend';
  if (!RANGES.some(r => r.key === rangeKey)) rangeKey = 'weekend';

  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }

  // --- Nachtschwärmer-Tag ---------------------------------------------------
  // Ein Kalendertag endet um Mitternacht, ein Ausgeh-Abend nicht. Um 1 Uhr
  // wäre die Party, die um 22 Uhr angefangen hat, sonst schlagartig "gestern"
  // und aus dem Heute-Filter verschwunden. Deshalb läuft der Tag hier bis
  // 5 Uhr morgens: Alles vor 5 Uhr zählt noch zum Vorabend.
  const NIGHT_END = 5;
  const isNightOwlHour = () => new Date().getHours() < NIGHT_END;
  // Beginn des laufenden Ausgeh-Tages (vor 5 Uhr: der gestrige)
  function dayStart(d) {
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    return d.getHours() < NIGHT_END ? addDays(s, -1) : s;
  }
  // Ende eines Ausgeh-Tages: der nächste Morgen um 5 Uhr
  function dayEnd(d) {
    const e = addDays(d, 1);
    e.setHours(NIGHT_END, 0, 0, 0);
    return e;
  }

  function rangeBounds(key) {
    const start = dayStart(new Date());
    if (key === 'today') return [start, dayEnd(start)];
    if (key === 'weekend') {
      // kommendes Sa+So; läuft das Wochenende schon, dann heute bis So
      const dow = start.getDay();                 // 0 = So, 6 = Sa
      const from = (dow === 6 || dow === 0) ? start : addDays(start, 6 - dow);
      const sunday = (dow === 0) ? start : addDays(from, (from.getDay() === 6) ? 1 : 0);
      return [from, dayEnd(sunday)];
    }
    return [start, dayEnd(addDays(start, +key - 1))];
  }

  function rangeLabel(key) {
    const [from, to] = rangeBounds(key);
    const f = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    const last = addDays(to, -1);
    return f(from) === f(last) ? f(from) : f(from) + ' – ' + f(last);
  }

  function inRangeEvents() {
    const [from, to] = rangeBounds(rangeKey);
    return data.events.filter(e => {
      const s = parseLocal(e.start);
      if (!s) return false;
      const en = parseLocal(e.end) || s;
      if (!(s < to && en >= from)) return false;
      if (radiusKm && distKm(e.lat, e.lon) > radiusKm) return false;
      return true;
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- Karte: Marker ------------------------------------------------------
  // ---- Marker & Umkreis ---------------------------------------------------
  // MapLibre kennt keine LayerGroup: DOM-Marker werden selbst verwaltet,
  // der Umkreis ist eine GeoJSON-Quelle.
  let evtMarkers = [];
  let scopeMarker = null;

  const GEO_SCOPE = { type: 'FeatureCollection', features: [] };

  // Kreis als Polygon (kein turf noetig): 64 Stuetzpunkte reichen optisch
  function circlePolygon(lat, lon, km) {
    const ring = [];
    const dLat = km / 111;
    const dLon = km / (111 * Math.cos(lat * Math.PI / 180));
    for (let a = 0; a <= 360; a += 360 / 64) {
      const r = a * Math.PI / 180;
      ring.push([lon + dLon * Math.cos(r), lat + dLat * Math.sin(r)]);
    }
    return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: {} };
  }

  function addScopeLayers() {
    if (!map.getSource('scope')) map.addSource('scope', { type: 'geojson', data: GEO_SCOPE });
    else map.getSource('scope').setData(GEO_SCOPE);
    if (!map.getLayer('scope-line')) {
      map.addLayer({ id: 'scope-line', type: 'line', source: 'scope',
        paint: { 'line-color': '#8f1d1d', 'line-width': 1.5, 'line-dasharray': [4, 4], 'line-opacity': 0.55 } });
    }
  }

  function renderScope() {
    GEO_SCOPE.features = radiusKm ? [circlePolygon(center.lat, center.lon, radiusKm)] : [];
    const src = map.getSource('scope');
    if (src) src.setData(GEO_SCOPE);
    if (scopeMarker) scopeMarker.remove();
    const el = document.createElement('div');
    el.className = 'mk';
    el.style.cssText = 'font-size:20px;line-height:1;text-shadow:0 1px 2px rgba(11,11,11,.3);pointer-events:none';
    el.textContent = '📍';
    scopeMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
      .setLngLat([center.lon, center.lat]).addTo(map);
  }

  // ---- Tooltip / Popup ------------------------------------------------------
  // Desktop: Hover-Tooltip + Klick-Popup. Touch: nur Popup, sonst loest ein Tap
  // beides gleichzeitig aus.
  const tipEl = document.getElementById('hovertip');
  function showTip(html, x, y) {
    tipEl.innerHTML = html;
    tipEl.style.left = x + 'px';
    tipEl.style.top = y + 'px';
    tipEl.style.display = 'block';
  }
  function hideTip() { tipEl.style.display = 'none'; }

  function openPopup(lngLat, html) {
    const w = Math.min(340, document.documentElement.clientWidth - 40);
    if (IS_TOUCH || document.documentElement.clientWidth < 520) {
      map.easeTo({ center: lngLat, duration: 250 });
    }
    new maplibregl.Popup({ className: 'evt-popup', closeButton: true, maxWidth: w + 'px', offset: 16 })
      .setLngLat(lngLat).setHTML(html).addTo(map);
  }

  function bindMarker(el, lngLat, tipHtml, popupHtml) {
    // stopPropagation: sonst schliesst MapLibres closeOnClick das Popup sofort
    if (IS_TOUCH) {
      el.addEventListener('click', ev => { ev.stopPropagation(); openPopup(lngLat, popupHtml); });
      return;
    }
    el.addEventListener('mouseenter', e => showTip(tipHtml, e.clientX, e.clientY));
    el.addEventListener('mousemove', e => showTip(tipHtml, e.clientX, e.clientY));
    el.addEventListener('mouseleave', hideTip);
    el.addEventListener('click', ev => { ev.stopPropagation(); hideTip(); openPopup(lngLat, popupHtml); });
  }

  let legendDiv = null, infoDiv = null;
  let counts = {}, shownGroups = 0, shownDates = 0;

  function evtIconEl(cat) {
    const el = document.createElement('div');
    el.className = 'mk';
    el.innerHTML = '<div style="width:28px;height:28px;border-radius:50%;background:#fcfcfb;' +
      'border:2px solid ' + CATS[cat].color + ';box-shadow:0 1px 4px rgba(11,11,11,.25);' +
      'display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1">' +
      CATS[cat].emoji + '</div>';
    return el;
  }

  function rebuild() {
    evtMarkers.forEach(m => m.remove());
    evtMarkers = [];
    counts = {}; Object.keys(CATS).forEach(c => counts[c] = 0);
    shownGroups = 0; shownDates = 0;

    const inRange = inRangeEvents();
    shownDates = inRange.length;

    // Gleiches Event (Titel + Ort) mit mehreren Terminen -> EIN Marker
    const groups = new Map();
    inRange.forEach(e => {
      const key = e.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim() +
                  '|' + e.lat.toFixed(4) + '|' + e.lon.toFixed(4);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(e);
    });

    // Sichtbare Veranstaltungen einsammeln (Zähler = Gesamtzahl im Zeitraum)
    const visible = [];
    groups.forEach(list => {
      list.sort((a, b) => a.start < b.start ? -1 : 1);
      const cat = catOf(list[0]);
      counts[cat]++;
      if (!activeCats[cat]) return;        // ausgeblendete Kategorie
      shownGroups++;
      visible.push(list);
    });

    // Veranstaltungen am SELBEN Ort (~11 m) zu einem Venue-Marker bündeln —
    // Marker bleiben exakt auf der Event-Position (keine künstliche Spirale)
    const venues = new Map();
    visible.forEach(list => {
      const e = list[0];
      const key = e.lat.toFixed(4) + '/' + e.lon.toFixed(4);
      if (!venues.has(key)) venues.set(key, []);
      venues.get(key).push(list);
    });

    venues.forEach(lists => {
      if (lists.length === 1) {
        addSingleMarker(lists[0]);
      } else {
        addVenueMarker(lists);
      }
    });

    function addSingleMarker(list) {
      const e = list[0];
      const cat = catOf(e);
      const more = list.length - 1;
      const tip = '<div class="tip-head">' + esc(e.title) +
        (isRunning(e) ? ' <span class="live-badge">l&auml;uft gerade</span>' : '') + '</div>' +
        (e.place ? '<div class="tip-sub">' + esc(e.place) + '</div>' : '') +
        '<table>' +
        '<tr><td>Wann</td><td>' + fmtDate(e.start) +
          (e.end && e.end.slice(0, 10) !== e.start.slice(0, 10) ? ' – ' + fmtDate(e.end) : '') +
          (more > 0 ? '<br><i>+ ' + more + ' weitere' + (more > 1 ? ' Termine' : 'r Termin') + '</i>' : '') + '</td></tr>' +
        '<tr><td>Kategorie</td><td>' + CATS[cat].emoji + ' ' + CATS[cat].label + '</td></tr>' +
        '<tr><td>Quelle</td><td>' + esc(e.source) +
          (licHtml(e) ? ' · ' + licHtml(e) : '') + '</td></tr>' +
        '</table>' +
        (e.desc ? '<div class="tip-flag">' + esc(e.desc) + '</div>' : '') +
        '<div class="tip-flag">Klicken f&uuml;r Details &amp; Link</div>';

      const dateList = list.slice(0, 6).map(x => fmtDate(x.start)).join('<br>') +
        (list.length > 6 ? '<br>…' : '');
      const popup = '<b>' + esc(e.title) + '</b>' +
        (e.place ? '<br>' + esc(e.place) : '') +
        '<br>' + dateList +
        // Die Landesdatenbank fuehrt nicht zu jedem Termin eine oeffentliche
        // Seite — dann nur die Quelle nennen statt ins Leere zu verlinken.
        (e.url ? '<br><a href="' + esc(e.url) + '" target="_blank" rel="noopener">Zur Veranstaltungsseite (' + esc(e.source) + ')</a>'
               : '<br><span class="tip-sub">Quelle: ' + esc(e.source) + '</span>') +
        (licHtml(e) ? '<br><span class="tip-sub">Lizenz: ' + licHtml(e) + '</span>' : '');

      const el = evtIconEl(cat);
      const ll = [e.lon, e.lat];
      bindMarker(el, ll, '<div class="evt-tip">' + tip + '</div>', popup);
      evtMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map));
    }

    function addVenueMarker(lists) {
      lists.sort((a, b) => a[0].start < b[0].start ? -1 : 1);
      const first = lists[0][0];
      // dominante Kategorie bestimmt die Randfarbe
      const catCount = {};
      lists.forEach(l => { const c = catOf(l[0]); catCount[c] = (catCount[c] || 0) + 1; });
      const domCat = Object.keys(catCount).sort((a, b) => catCount[b] - catCount[a])[0];
      // häufigster Ortsname als Titel
      const placeCount = {};
      lists.forEach(l => { const p = l[0].place; if (p) placeCount[p] = (placeCount[p] || 0) + 1; });
      const placeLabel = Object.keys(placeCount).sort((a, b) => placeCount[b] - placeCount[a])[0] || 'Veranstaltungsort';

      const el = document.createElement('div');
      el.className = 'mk';
      el.innerHTML = '<div style="width:30px;height:30px;border-radius:50%;background:#fcfcfb;' +
        'border:2px solid ' + CATS[domCat].color + ';box-shadow:0 1px 4px rgba(11,11,11,.25);' +
        'display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;' +
        'color:#0b0b0b;line-height:1">' + lists.length + '</div>';

      const tipRows = lists.slice(0, 6).map(l => {
        const e = l[0];
        return '<tr><td>' + fmtDate(e.start) + '</td><td>' + CATS[catOf(e)].emoji + ' ' +
               esc(e.title.length > 44 ? e.title.slice(0, 43) + '…' : e.title) + '</td></tr>';
      }).join('');
      const tip = '<div class="tip-head">' + esc(placeLabel) + '</div>' +
        '<div class="tip-sub">' + lists.length + ' Veranstaltungen an diesem Ort</div>' +
        '<table>' + tipRows +
        (lists.length > 6 ? '<tr><td></td><td><i>+ ' + (lists.length - 6) + ' weitere</i></td></tr>' : '') +
        '</table>' +
        '<div class="tip-flag">Klicken f&uuml;r Liste mit Links</div>';

      const popup = '<b>' + esc(placeLabel) + '</b><br>' +
        lists.slice(0, 12).map(l => {
          const e = l[0];
          const t = esc(e.title.length > 60 ? e.title.slice(0, 59) + '…' : e.title);
          return fmtDate(e.start) + ' — ' +
                 (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + t + '</a>' : t);
        }).join('<br>') +
        (lists.length > 12 ? '<br><i>+ ' + (lists.length - 12) + ' weitere — Listenansicht nutzen</i>' : '');

      const ll = [first.lon, first.lat];
      bindMarker(el, ll, '<div class="evt-tip">' + tip + '</div>', popup);
      evtMarkers.push(new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map));
    }

    renderScope();
    renderLegend();
    renderInfo();
    if (listOpen) renderList();
  }

  function renderLegend() {
    if (!legendDiv) return;
    legendDiv.innerHTML = '<button class="mob-toggle" aria-label="Kategorien ein-/ausblenden" title="Kategorien">☰</button>' +
      '<h1>Kategorien (' + rangeLabel(rangeKey) + ')</h1>' +
      Object.keys(CATS).map(c =>
        '<div class="row' + (activeCats[c] ? '' : ' off') + '" data-cat="' + c + '">' +
        '<span class="dot" style="background:' + CATS[c].color + '"></span>' +
        '<span class="label">' + CATS[c].emoji + ' ' + CATS[c].label + ' (' + counts[c] + ')</span></div>'
      ).join('') +
      '<div class="size-hint">Klick auf eine Kategorie blendet sie ein/aus.<br>' +
      'Marker mit Zahl = mehrere Veranstaltungen<br>am selben Ort (Klick zeigt die Liste).</div>';
  }

  function toggleCat(c) {
    activeCats[c] = !activeCats[c];
    localStorage.setItem('eventmap.cats', JSON.stringify(activeCats));
    rebuild();
  }

  function renderInfo() {
    if (!infoDiv) return;
    infoDiv.innerHTML =
      '<h1>Events — Freiburg &amp; Umgebung</h1>' +
      '<div class="meta">Stadtfeste, Partys, Konzerte, M&auml;rkte &amp; mehr im Umkreis von ca. 50 km — ' +
      'aus offenen Quellen (toubiz/Open Data BW, FWTM, Rausgegangen, szene-Radar, Alemannische Seiten, Heuboden).</div>' +
      '<div class="meta" style="margin-top:6px">' +
      '<b>' + shownGroups + '</b> Veranstaltungen sichtbar (' + shownDates + ' Termine im Zeitraum ' + rangeLabel(rangeKey) + ')' +
      '<br>Umkreis: <b>' + radiusLabel() + '</b> um <b>' + esc(center.label) + '</b>' +
      '<br>Datenstand: <b>' + esc(data.generated) + '</b></div>' +
      '<div class="pane-links"><a href="faq.html">FAQ</a> · <a href="impressum.html">Impressum</a> · ' +
      '<a href="datenschutz.html">Datenschutz</a> · <a href="hinweise.html">Hinweise</a></div>';
  }

  // Strichsymbole statt Emoji: einheitliche Größe, ruhigere Optik
  const SVG = {
    info:   '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.6"/>',
    clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 2"/>',
    pin:    '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>',
    layers: '<path d="M12 3.5 3.5 8 12 12.5 20.5 8 12 3.5Z"/><path d="m4 12 8 4.2 8-4.2"/><path d="m4 16 8 4.2 8-4.2"/>',
    legend: '<path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.3" cy="6.5" r="1.5"/><circle cx="4.3" cy="12" r="1.5"/><circle cx="4.3" cy="17.5" r="1.5"/>',
    filter: '<path d="M3.5 5.5h17l-6.6 7.6v5.4l-3.8 2v-7.4L3.5 5.5Z"/>',
    target: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 1.8v3.4M12 18.8v3.4M22.2 12h-3.4M5.2 12H1.8"/>'
  };
  function icon(n, cls) {
    return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SVG[n] + '</svg>';
  }

  // ---- Bedienelemente Karte ----------------------------------------------
  // Minimal-IControl: MapLibre erwartet nur onAdd/onRemove
  function ctrl(el) { return { onAdd: () => el, onRemove: () => el.remove() }; }
  function stopMapEvents(el) {
    ['mousedown', 'dblclick', 'touchstart', 'wheel', 'click'].forEach(ev =>
      el.addEventListener(ev, e => e.stopPropagation()));
  }
  function panelWrap(inner, cls) {
    const w = document.createElement('div');
    w.className = 'maplibregl-ctrl panel ' + (cls || '');
    stopMapEvents(w);
    w.appendChild(inner);
    return w;
  }
  function pane(cls) {
    const d = document.createElement('div');
    d.className = 'pane ' + cls;
    return d;
  }

  // Info
  infoDiv = pane('pane-info info-panel');
  renderInfo();

  // Zeitraum
  const paneRange = pane('pane-range range-ctl');
  paneRange.innerHTML = '<span class="lbl">Zeitraum</span>' + RANGES.map(r =>
    '<button class="range-btn' + (r.key === rangeKey ? ' active' : '') + '" data-key="' + r.key + '"' +
    (r.title ? ' title="' + r.title + '"' : '') + '>' + r.label + '</button>').join('');
  paneRange.addEventListener('click', e => {
    const btn = e.target.closest('.range-btn');
    if (btn) setRange(btn.dataset.key);
  });

  function setRange(key) {
    rangeKey = key;
    localStorage.setItem('eventmap.range', rangeKey);
    document.querySelectorAll('.range-btn[data-key]').forEach(b => b.classList.toggle('active', b.dataset.key === rangeKey));
    document.querySelectorAll('#lv-range .chip').forEach(b => b.classList.toggle('active', b.dataset.key === rangeKey));
    rebuild();
  }

  // Umkreis: Radius-Vorgaben + Zentrum per PLZ
  const paneScope = pane('pane-scope range-ctl scope-ctl');
  paneScope.innerHTML = '<span class="lbl">Umkreis</span>' +
    RADII.map(r =>
      '<button class="range-btn scope-r' + (r === radiusKm ? ' active' : '') + '" data-km="' + r + '">' +
      (r ? r + ' km' : 'Alle') + '</button>').join('') +
    '<span class="center-lbl" id="center-lbl">\📍 ' + esc(center.label) + '</span>' +
    '<input id="plz-in" inputmode="numeric" maxlength="5" placeholder="PLZ">' +
    '<button class="range-btn" id="plz-go">Setzen</button>' +
    '<button class="range-btn" id="plz-reset" title="Zur&uuml;ck zu Waldkirch">&#8634;</button>' +
    '<span class="hint" id="plz-hint"></span>';
  paneScope.addEventListener('click', e => {
    const btn = e.target.closest('.scope-r');
    if (btn) { setRadius(+btn.dataset.km); return; }
    if (e.target.id === 'plz-go') setCenterFromPlz(paneScope.querySelector('#plz-in').value.trim(), paneScope.querySelector('#plz-hint'));
    if (e.target.id === 'plz-reset') {
      paneScope.querySelector('#plz-in').value = '';
      paneScope.querySelector('#plz-hint').textContent = '';
      setCenter(DEFAULT_CENTER);
    }
  });
  paneScope.querySelector('#plz-in').addEventListener('keydown', e => {
    if (e.key === 'Enter') setCenterFromPlz(e.target.value.trim(), paneScope.querySelector('#plz-hint'));
  });

  function updateScopeUIs() {
    document.querySelectorAll('.scope-r').forEach(b => b.classList.toggle('active', +b.dataset.km === radiusKm));
    document.querySelectorAll('#lv-radius-group .chip').forEach(b => b.classList.toggle('active', +b.dataset.km === radiusKm));
    const cl = document.getElementById('center-lbl');
    if (cl) cl.textContent = '\📍 ' + center.label;
    const ll = document.getElementById('lv-radius-lbl');
    if (ll) ll.textContent = 'Umkreis um ' + center.label;
  }

  // Kategorien (fruehere Legende) - klickbar
  legendDiv = pane('pane-legend legend');
  legendDiv.addEventListener('click', e => {
    const row = e.target.closest('.row[data-cat]');
    if (row) toggleCat(row.dataset.cat);
  });
  renderLegend();

  // Kartenstil mit Bildvorschau. Die Basiskarten-Auswahl lag frueher als
  // eigenes Leaflet-Menue unten links; jetzt steckt sie hier - eine Stelle
  // fuer Karte und Ebenen, wie auf der Feuerkarte.
  const paneStyle = pane('pane-style');
  paneStyle.innerHTML = '<div class="style-grid">' +
    Object.keys(STYLES).map(k =>
      '<label class="style-card' + (k === styleChoice ? ' active' : '') + '">' +
      '<input type="radio" name="basestyle" value="' + k + '"' + (k === styleChoice ? ' checked' : '') + '>' +
      '<img src="thumbs/' + k + '.jpg" alt="" width="520" height="340" loading="lazy">' +
      '<span class="style-name">' + STYLES[k].short + '</span></label>').join('') + '</div>';
  paneStyle.addEventListener('change', e => {
    if (e.target.name !== 'basestyle') return;
    styleChoice = e.target.value;
    localStorage.setItem('eventmap.style', styleChoice);
    paneStyle.querySelectorAll('.style-card').forEach(c =>
      c.classList.toggle('active', c.querySelector('input').value === styleChoice));
    map.setStyle(window.MAP_STYLES.resolve(styleChoice));
  });

  // Desktop-Panels
  const wrapInfo = panelWrap(infoDiv);
  const wrapRange = panelWrap(paneRange);
  const wrapScope = panelWrap(paneScope);
  const wrapLegend = panelWrap(legendDiv, 'legend');
  const wrapStyle = document.createElement('div');
  wrapStyle.className = 'maplibregl-ctrl panel layer-ctl';
  stopMapEvents(wrapStyle);
  wrapStyle.innerHTML =
    '<button class="lc-toggle" aria-label="Kartenstil oeffnen" title="Kartenstil">' + icon('layers') + '</button>' +
    '<div class="lc-body"><div class="lc-head"><span>Kartenstil</span>' +
    '<button class="lc-close" aria-label="schliessen">✕</button></div></div>';
  const lcBody = wrapStyle.querySelector('.lc-body');
  lcBody.appendChild(paneStyle);
  wrapStyle.querySelector('.lc-toggle').addEventListener('click', () => wrapStyle.classList.add('open'));
  wrapStyle.querySelector('.lc-close').addEventListener('click', () => wrapStyle.classList.remove('open'));

  map.addControl(ctrl(wrapInfo), 'top-left');
  map.addControl(ctrl(wrapRange), 'top-left');
  map.addControl(ctrl(wrapScope), 'top-left');
  map.addControl(ctrl(wrapStyle), 'bottom-left');
  map.addControl(ctrl(wrapLegend), 'bottom-right');

  // Nach jedem Stilwechsel: Globus setzen und eigene Ebenen neu anlegen
  map.on('style.load', () => {
    try { map.setProjection({ type: 'globe' }); } catch (e) { console.warn('Globus nicht verfuegbar:', e); }
    try { if (!map.getStyle().sky) map.setSky(skyFor(PAL.hell)); } catch (e) { /* optional */ }
    addScopeLayers();
    renderScope();
  });

  // ---- Listenansicht ------------------------------------------------------
  let listOpen = false;
  let lvSearch = '', lvDays = new Set(), lvSource = '';
  let lvSort = { col: 'start', dir: 1 };
  const LV_MAX = 500;

  const COLS = [
    { key: 'start',  label: 'Datum' },
    { key: 'title',  label: 'Titel' },
    { key: 'place',  label: 'Ort' },
    { key: 'cat',    label: 'Kategorie' },
    { key: 'source', label: 'Quelle' },
    { key: 'dist',   label: 'km' }
  ];
  const DAY_LABELS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  function lvFiltered() {
    const q = lvSearch.trim().toLowerCase();
    return inRangeEvents().filter(e => {
      const cat = catOf(e);
      if (!activeCats[cat]) return false;
      if (q && !((e.title || '').toLowerCase().includes(q) || (e.place || '').toLowerCase().includes(q))) return false;
      if (lvDays.size) {
        const d = parseLocal(e.start);
        if (!d || !lvDays.has(d.getDay())) return false;
      }
      if (lvSource && e.source !== lvSource) return false;
      return true;
    });
  }

  function renderList() {
    // Kopfzeile
    document.getElementById('lv-head').innerHTML = COLS.map(c =>
      '<th data-col="' + c.key + '">' + c.label +
      (lvSort.col === c.key ? ' <span class="arr">' + (lvSort.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>'
    ).join('');

    const rows = lvFiltered();
    const val = (e, col) =>
      col === 'dist' ? distKm(e.lat, e.lon) :
      col === 'cat' ? catOf(e) :
      (e[col] || '');
    rows.sort((a, b) => {
      const x = val(a, lvSort.col), y = val(b, lvSort.col);
      if (x < y) return -lvSort.dir;
      if (x > y) return lvSort.dir;
      return a.start < b.start ? -1 : 1;
    });

    const shown = rows.slice(0, LV_MAX);
    document.getElementById('lv-body').innerHTML = shown.map(e => {
      const cat = catOf(e);
      // data-col: auf dem Handy wird die Tabelle per CSS zu Karten umgebaut,
      // die Spalten werden dort einzeln angesprochen statt über die Position.
      return '<tr>' +
        '<td data-col="start">' + fmtDate(e.start) +
          (e.end && e.end.slice(0, 10) !== e.start.slice(0, 10) ? '<br>– ' + fmtDate(e.end) : '') +
          (isRunning(e) ? '<span class="live-badge">läuft gerade</span>' : '') + '</td>' +
        '<td class="t-title" data-col="title">' +
          (e.url ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a>'
                 : esc(e.title)) + '</td>' +
        '<td class="t-place" data-col="place">' + esc(e.place || '–') + '</td>' +
        '<td data-col="cat">' + CATS[cat].emoji + ' ' + CATS[cat].label + '</td>' +
        '<td data-col="source">' + esc(e.source) + '</td>' +
        '<td data-col="dist">' + distKm(e.lat, e.lon).toFixed(0) + '</td>' +
        '</tr>';
    }).join('');

    const more = document.getElementById('lv-more');
    if (rows.length > LV_MAX) {
      more.style.display = '';
      more.textContent = 'Weitere ' + (rows.length - LV_MAX) + ' Termine — Filter verfeinern, um sie zu sehen.';
    } else {
      more.style.display = 'none';
    }

    document.getElementById('lv-count').innerHTML = '<b>' + rows.length + '</b> Termine';
    // Kategorie-Chips synchron zur Legende
    document.querySelectorAll('#lv-cats .chip').forEach(b => b.classList.toggle('active', !!activeCats[b.dataset.cat]));
    syncLvBar(rows.length);
  }

  function initListControls() {
    // Zeitraum-Chips
    const rangeSpan = document.getElementById('lv-range');
    RANGES.forEach(r => {
      const b = document.createElement('button');
      b.className = 'chip' + (r.key === rangeKey ? ' active' : '');
      b.dataset.key = r.key;
      b.textContent = r.label;
      if (r.title) b.title = r.title;
      b.addEventListener('click', () => setRange(r.key));
      rangeSpan.appendChild(b);
    });
    // Kategorie-Chips
    const catSpan = document.getElementById('lv-cats');
    Object.keys(CATS).forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (activeCats[c] ? ' active' : '');
      b.dataset.cat = c;
      b.textContent = CATS[c].emoji + ' ' + CATS[c].label;
      b.addEventListener('click', () => toggleCat(c));
      catSpan.appendChild(b);
    });
    // Wochentag-Chips (Mo–So)
    const daySpan = document.getElementById('lv-days');
    [1, 2, 3, 4, 5, 6, 0].forEach(d => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = DAY_LABELS[d];
      b.addEventListener('click', () => {
        if (lvDays.has(d)) { lvDays.delete(d); b.classList.remove('active'); }
        else { lvDays.add(d); b.classList.add('active'); }
        renderList();
      });
      daySpan.appendChild(b);
    });
    // Suche
    document.getElementById('lv-search').addEventListener('input', e => {
      lvSearch = e.target.value; renderList();
    });
    // Umkreis-Chips (synchron zur Karten-Steuerung)
    const radSpan = document.getElementById('lv-radius-group');
    RADII.forEach(r => {
      const b = document.createElement('button');
      b.className = 'chip' + (r === radiusKm ? ' active' : '');
      b.dataset.km = r;
      b.textContent = r ? r + ' km' : 'alle';
      b.addEventListener('click', () => setRadius(r));
      radSpan.appendChild(b);
    });
    // Quelle
    const srcSel = document.getElementById('lv-source');
    [...new Set(data.events.map(e => e.source))].sort().forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      srcSel.appendChild(o);
    });
    srcSel.addEventListener('change', e => { lvSource = e.target.value; renderList(); });
    // Sortierung
    document.getElementById('lv-head').addEventListener('click', e => {
      const th = e.target.closest('th[data-col]');
      if (!th) return;
      const col = th.dataset.col;
      if (lvSort.col === col) lvSort.dir = -lvSort.dir;
      else lvSort = { col: col, dir: 1 };
      renderList();
    });
  }

  // ---- Mobile Bedienung: Leiste unten + Sheet ------------------------------
  // Auf dem Handy lagen die Panels (Info, Zeitraum, Umkreis, Kategorien) als
  // freie Icon-Kacheln auf der Karte und überlagerten sich mit der
  // Attributionszeile — der Ebenen-Button war dadurch nicht mehr tippbar.
  // Jetzt wandern dieselben Knoten bei Bedarf in ein Sheet; dadurch gibt es
  // jede Ansicht weiterhin nur einmal und alle Handler bleiben daran hängen.
  let mobClose = null;

  function initMobileShell() {
    const PANES = [
      { id: 'info',  title: 'Übersicht',   icon: 'info',   label: 'Info',    sel: '.info-panel' },
      { id: 'range', title: 'Zeitraum',    icon: 'clock',  label: 'Zeit',    sel: '.range-ctl:not(.scope-ctl)' },
      { id: 'scope', title: 'Umkreis',     icon: 'pin',    label: 'Umkreis', sel: '.scope-ctl' },
      { id: 'cats',  title: 'Kategorien',  icon: 'legend', label: 'Kat.',    sel: '.legend' },
      { id: 'base',  title: 'Kartenstil',  icon: 'layers', label: 'Karte',   sel: '.pane-style' }
    ].map(p => {
      const el = document.querySelector(p.sel);
      return el ? Object.assign(p, { el: el, home: el.parentNode }) : null;
    }).filter(Boolean);

    // Filter der Listenansicht bekommen dasselbe Sheet
    const lvFilters = document.querySelector('.lv-filters');

    const scrim = document.createElement('div');
    scrim.id = 'scrim';
    const sheet = document.createElement('div');
    sheet.id = 'sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.innerHTML = '<div class="sheet-grip"></div>' +
      '<div class="sheet-head"><b id="sheet-title"></b>' +
      '<button class="sheet-close" aria-label="schließen">✕</button></div>' +
      '<div class="sheet-body" id="sheet-body"></div>';
    const sheetBody = sheet.querySelector('#sheet-body');
    const sheetTitle = sheet.querySelector('#sheet-title');

    const mbar = document.createElement('div');
    mbar.id = 'mbar';
    mbar.innerHTML = PANES.map(p =>
      '<button data-pane="' + p.id + '" aria-label="' + p.title + '">' + icon(p.icon) +
      '<span class="tx">' + p.label + '</span></button>').join('');

    document.body.appendChild(scrim);
    document.body.appendChild(sheet);
    document.body.appendChild(mbar);

    let open = null;
    function homeAll() {
      PANES.forEach(p => { if (p.el.parentNode === sheetBody) p.home.appendChild(p.el); });
      if (lvFilters && lvFilters.parentNode === sheetBody) {
        const lv = document.getElementById('listview');
        lv.insertBefore(lvFilters, lv.firstChild);
      }
    }
    function close() {
      sheet.classList.remove('open');
      scrim.classList.remove('open');
      open = null;
      mbar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      setTimeout(homeAll, 320);   // erst nach der Animation, sonst ruckelt es
    }
    mobClose = close;
    function openPane(id) {
      if (open === id) { close(); return; }
      homeAll();
      let title, node;
      if (id === 'lvfilter') { title = 'Filter'; node = lvFilters; }
      else {
        const p = PANES.find(x => x.id === id);
        if (!p) return;
        title = p.title; node = p.el;
      }
      sheetTitle.textContent = title;
      sheetBody.appendChild(node);
      sheet.classList.add('open');
      scrim.classList.add('open');
      open = id;
      mbar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.pane === id));
    }
    mbar.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) openPane(b.dataset.pane);
    });
    sheet.querySelector('.sheet-close').addEventListener('click', close);
    scrim.addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) close(); });
    window.addEventListener('resize', () => { if (!isMobile() && open) close(); });

    // --- Leiste der Listenansicht: Filter-Button, Sortierung, Trefferzahl ---
    const SORTS = [
      { v: 'start:1',  t: 'Datum, früheste zuerst' },
      { v: 'start:-1', t: 'Datum, späteste zuerst' },
      { v: 'dist:1',   t: 'Entfernung, nächste zuerst' },
      { v: 'title:1',  t: 'Titel A–Z' },
      { v: 'place:1',  t: 'Ort A–Z' },
      { v: 'cat:1',    t: 'Kategorie' }
    ];
    const lvBar = document.createElement('div');
    lvBar.className = 'lv-mobilebar';
    lvBar.innerHTML =
      '<button class="fbtn" id="lv-filterbtn">' + icon('filter') + '<span id="lv-filtertx">Filter</span></button>' +
      '<select id="lv-sortsel" aria-label="Sortierung">' +
      SORTS.map(s => '<option value="' + s.v + '">' + s.t + '</option>').join('') + '</select>' +
      '<span class="cnt" id="lv-cnt2"></span>';
    const lv = document.getElementById('listview');
    lv.insertBefore(lvBar, lv.firstChild);
    document.getElementById('lv-filterbtn').addEventListener('click', () => openPane('lvfilter'));
    const sortSel = document.getElementById('lv-sortsel');
    sortSel.value = lvSort.col + ':' + lvSort.dir;
    sortSel.addEventListener('change', () => {
      const p = sortSel.value.split(':');
      lvSort = { col: p[0], dir: +p[1] };
      renderList();
    });
  }

  // Hält Trefferzahl, Sortierung und den "aktiv"-Zustand des Filter-Buttons
  // der Mobil-Leiste im Takt mit den echten Filtern.
  function syncLvBar(count) {
    const cnt = document.getElementById('lv-cnt2');
    if (cnt) cnt.innerHTML = '<b>' + count + '</b> Termine';
    const sel = document.getElementById('lv-sortsel');
    if (sel) sel.value = lvSort.col + ':' + lvSort.dir;
    const btn = document.getElementById('lv-filterbtn');
    if (btn) {
      // Wie viele Filter weichen vom Standard ab? Zahl auf den Button.
      let n = 0;
      if (lvSearch.trim()) n++;
      if (lvDays.size) n++;
      if (lvSource) n++;
      const allCats = Object.keys(CATS).filter(c => activeCats[c]).length;
      if (allCats !== Object.keys(CATS).length) n++;
      btn.classList.toggle('has', n > 0);
      document.getElementById('lv-filtertx').textContent = n ? 'Filter · ' + n : 'Filter';
    }
  }


  // Umschalter Karte/Liste
  const btnMap = document.getElementById('btn-map');
  const btnList = document.getElementById('btn-list');
  function setView(list) {
    listOpen = list;
    document.getElementById('listview').classList.toggle('open', list);
    btnMap.classList.toggle('active', !list);
    btnList.classList.toggle('active', list);
    // Karten-Leiste und Standort-Button gehören zur Karte, nicht zur Liste
    document.body.classList.toggle('list-open', list);
    if (mobClose) mobClose();
    if (list) renderList();
  }
  btnMap.addEventListener('click', () => setView(false));
  btnList.addEventListener('click', () => setView(true));

  initListControls();
  initMobileShell();
  updateScopeUIs();
  fitToScope();
  rebuild();

  // MapLibre zeigt die kompakte Attribution zunaechst ausgeklappt; auf dem
  // Handy verdeckt die Zeile den halben Kartenfuss. Einklappen — ein Tipp auf
  // das i zeigt sie wieder, die Rechtslinks stehen zusaetzlich im Info-Sheet.
  if (isMobile()) {
    map.once('load', () => {
      const a = document.querySelector('.maplibregl-ctrl-attrib');
      if (a) a.classList.remove('maplibregl-compact-show');
    });
  }

  // Fuer den automatisierten Check (scripts/events-check.mjs)
  window.__eventMap = map;

  // Seite stündlich neu laden (der Scheduler aktualisiert die Datendatei;
  // Zeitraum & Kategorien bleiben via localStorage erhalten)
  setTimeout(function () { location.reload(); }, 60 * 60 * 1000);
})();
</script>
