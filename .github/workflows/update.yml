name: Daten aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'   # Einsatzmeldungen (RSS + NINA)
    - cron: '7 * * * *'      # Satellitendaten (NASA FIRMS)
    - cron: '25 5 * * *'     # Waldbrandindex (DWD, nach dem 04:15-UTC-Lauf)
    - cron: '40 4 * * *'     # Eventkarte (täglich)
    - cron: '10 6 * * *'     # Sentinel-2-Brandnarben (täglich, nach WBI)
  push:
    branches: [main]         # Code-Änderungen -> nur Deploy (Update-Schritte werden übersprungen)
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Presseportal-Archivseiten einlesen (Backfill)'
        type: boolean
        default: false

permissions:
  contents: write

# Nur ein Update-Lauf gleichzeitig, damit sich die Commits nicht in die Quere kommen
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Einsatzmeldungen aktualisieren
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
        shell: pwsh
        env:
          FIREMAP_BACKFILL: ${{ inputs.backfill }}
          PRESSEPORTAL_API_KEY: ${{ secrets.PRESSEPORTAL_API_KEY }}
        run: ./update-reports.ps1

      - name: Satellitendaten aktualisieren
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
        shell: pwsh
        run: ./update-data.ps1

      - name: Waldbrandindex aktualisieren
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '25 5 * * *'
        shell: pwsh
        run: ./update-wbi.ps1

      # Headless-Browser-Quellen (RegioTrends/tPortal) — Ausfall bricht nichts:
      # update-events.ps1 überspringt die Quelle, wenn die JSON fehlt/alt ist
      - name: Headless-Quellen scrapen (Playwright)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 4 * * *'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/events-headless.mjs

      - name: Eventkarte aktualisieren
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 4 * * *'
        shell: pwsh
        run: ./update-events.ps1

      - name: Sentinel-2-Brandnarben berechnen
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '10 6 * * *'
        shell: pwsh
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: ./update-burnscars.ps1

      - name: Kreis-Landingpages generieren
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
        shell: pwsh
        run: ./generate-kreise.ps1

      - name: Änderungen committen
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ kreise/
          if ! git diff --cached --quiet; then
            git commit -m "Daten-Update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Direct-Upload zu Cloudflare (statt Git-Builds -> kein Build-Kontingent).
      # Deployt bei Code-Pushes immer, bei Cron-Läufen nur wenn Daten geändert.
      - name: Deploy zu Cloudflare (Wrangler)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist/data
          cp index.html events.html globe.html klassisch.html faq.html impressum.html datenschutz.html hinweise.html \
             robots.txt sitemap.xml llms.txt favicon.svg og-image.png dist/
          cp -r kreise dist/kreise
          cp -r thumbs dist/thumbs
          cp data/*.js dist/data/
          npx --yes wrangler@4 deploy
